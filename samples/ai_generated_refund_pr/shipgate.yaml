version: "0.1"

project:
  name: ai-generated-refund-pr-demo
  owner: support-platform

agent:
  name: support-agent
  declared_purpose:
    - answer support knowledge base questions
    - prepare refund cases for human review

environment:
  target: production_like

tool_sources:
  - id: support_tools
    type: mcp
    path: tools.json
    trust: internal

agent_bindings:
  declarations:
    - agent: root
      complete: true
      tools:
        - {tool: support.search_kb, source_id: support_tools}
        - {tool: stripe.create_refund, source_id: support_tools}
      handoffs: []
      reason: reviewed verifier demo binding

permissions:
  scopes:
    - support:kb:read
  credential_mode: service_account

action_surface:
  actions:
    - tool: support.search_kb
      effect: read
      # "refund" in the tool text trips the financial-write keyword heuristic.
      # The reviewed effect stands; the override records that decision.
      override:
        evidence: [financial_write]
        reason: Read-only knowledge-base search; the refund wording is topical.
      scopes: [support:kb:read]
      authority:
        mode: scoped
        auth_type: oauth2
        credential_mode: service_account
    # Dormant in the base fixture. The verifier's head export activates this
    # reviewed declaration so the unsafe capability fails on missing controls.
    - tool: stripe.create_refund
      effect: destructive
      risk_tags: [financial_action]
      scopes: ["stripe:*"]
      authority:
        mode: scoped
        auth_type: oauth2
        credential_mode: service_account

ci:
  mode: advisory
  pr_comment: true
