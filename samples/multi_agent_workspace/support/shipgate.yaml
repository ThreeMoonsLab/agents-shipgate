version: "0.1"

project:
  name: workspace-support-agent

agent:
  name: support-reader
  declared_purpose:
    - read support ticket metadata

environment:
  target: local

tool_sources:
  - id: support_tools
    type: mcp
    path: tools.json

permissions:
  scopes:
    - support:read

action_surface:
  actions:
    - tool: support.ticket_lookup
      effect: read
      scopes: [support:read]
      authority:
        mode: scoped
        auth_type: oauth2
        credential_mode: delegated
