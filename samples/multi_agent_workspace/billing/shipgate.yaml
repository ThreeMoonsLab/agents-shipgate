version: "0.1"

project:
  name: workspace-billing-agent

agent:
  name: billing-reviewer
  declared_purpose:
    - prepare billing review requests

environment:
  target: local

tool_sources:
  - id: billing_tools
    type: mcp
    path: tools.json

policies:
  require_approval_for_tools:
    - billing.refund_preview

action_surface:
  actions:
    - tool: billing.refund_preview
      effect: read
      authority:
        mode: none

risk_overrides:
  tools:
    billing.refund_preview:
      tags: [read_only]
      remove_tags: [financial_action]
      confidence: manual
      reason: computes a preview and never submits a refund
