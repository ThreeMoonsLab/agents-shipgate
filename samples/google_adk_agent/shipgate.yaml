version: "0.1"

project:
  name: google-adk-support-agent

agent:
  name: adk-support-agent
  declared_purpose:
    - handle support lookup and approval routing

environment:
  target: production_like

tool_sources:
  - id: adk_support
    type: google_adk
    path: agent.py

google_adk:
  eval_sets:
    - evals/support.eval.json
  # Reviewed inventory resolves the otherwise AST-only function bindings.
  # `source_id` names the source it completes: each entry matching a name
  # `adk_support` already exposes is joined to that observation rather than
  # added beside it, so the catalog keeps its size and the tools reach high
  # extraction confidence. Written out tool by tool, this is the same thing as
  # a `tool_identity.bindings` entry per name — see samples/simple_crewai_agent
  # and samples/simple_langchain_agent for that longer form.
  tool_inventories:
    - path: inventories/function-tools.json
      source_id: adk_support

action_surface:
  actions:
    - tool: lookup_case
      effect: read
      authority:
        mode: none
    - tool: request_refund_approval
      effect: write
      authority:
        mode: none
      approval:
        required: true
    - tool: support.search
      effect: read
      authority:
        mode: none
    - tool: support.get_case
      effect: read
      authority:
        mode: none

policies:
  require_approval_for_tools:
    - request_refund_approval

risk_overrides:
  tools:
    request_refund_approval:
      tags: [write]
      remove_tags: [financial_action]
      confidence: manual
      reason: creates an internal approval request and does not issue a refund
