version: "0.1"

project:
  name: google-adk-support-agent

agent:
  name: adk-support-agent
  declared_purpose:
    - handle support lookup and approval routing

environment:
  target: production_like

tool_sources:
  - id: adk_support
    type: google_adk
    path: agent.py

google_adk:
  eval_sets:
    - evals/support.eval.json
  # Reviewed inventory resolves the otherwise AST-only function binding.
  tool_inventories:
    - inventories/function-tools.json

tool_identity:
  bindings:
    - id: adk_lookup_case
      provider: adk_support
      reason: reviewed inventory describes the statically bound ADK function
      primary: {source_id: "google_adk_inventory:inventories/function-tools.json", tool: lookup_case}
      members:
        - {source_id: adk_support, tool: lookup_case}
        - {source_id: "google_adk_inventory:inventories/function-tools.json", tool: lookup_case}
    - id: adk_refund_approval
      provider: adk_support
      reason: reviewed inventory describes the statically bound ADK function
      primary: {source_id: "google_adk_inventory:inventories/function-tools.json", tool: request_refund_approval}
      members:
        - {source_id: adk_support, tool: request_refund_approval}
        - {source_id: "google_adk_inventory:inventories/function-tools.json", tool: request_refund_approval}

action_surface:
  actions:
    - tool: lookup_case
      effect: read
      authority:
        mode: none
    - tool: request_refund_approval
      effect: write
      authority:
        mode: none
      approval:
        required: true
    - tool: support.search
      effect: read
      authority:
        mode: none
    - tool: support.get_case
      effect: read
      authority:
        mode: none

policies:
  require_approval_for_tools:
    - request_refund_approval

risk_overrides:
  tools:
    request_refund_approval:
      tags: [write]
      remove_tags: [financial_action]
      confidence: manual
      reason: creates an internal approval request and does not issue a refund
