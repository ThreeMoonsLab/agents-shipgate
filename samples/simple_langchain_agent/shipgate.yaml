version: "0.1"

project:
  name: simple-langchain-agent

agent:
  name: support-case-reader
  declared_purpose:
    - look up and summarize read-only support case metadata

environment:
  target: local

tool_sources:
  - id: langchain_agent
    type: langchain
    path: agent.py

langchain:
  # Explicit reviewed inventory outranks AST extraction for the release gate.
  tool_inventories:
    - inventories/tools.json

tool_identity:
  bindings:
    - id: langchain_lookup_case
      provider: langchain_agent
      reason: reviewed inventory describes the bound LangChain function
      primary: {source_id: "langchain_inventory:inventories/tools.json", tool: lookup_case}
      members:
        - {source_id: langchain_agent, tool: lookup_case}
        - {source_id: "langchain_inventory:inventories/tools.json", tool: lookup_case}
    - id: langchain_summarize_case
      provider: langchain_agent
      reason: reviewed inventory describes the bound structured tool
      primary: {source_id: "langchain_inventory:inventories/tools.json", tool: summarize_case}
      members:
        - {source_id: langchain_agent, tool: summarize_case}
        - {source_id: "langchain_inventory:inventories/tools.json", tool: summarize_case}

action_surface:
  actions:
    - tool: lookup_case
      effect: read
      authority:
        mode: none
    - tool: summarize_case
      effect: read
      authority:
        mode: none
