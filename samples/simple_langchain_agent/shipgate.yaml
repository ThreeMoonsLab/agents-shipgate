version: "0.1"

project:
  name: simple-langchain-agent

agent:
  name: support-case-reader
  declared_purpose:
    - look up and summarize read-only support case metadata

environment:
  target: local

tool_sources:
  - id: langchain_agent
    type: langchain
    path: agent.py

langchain:
  # Explicit reviewed inventory outranks AST extraction for the release gate.
  tool_inventories:
    - inventories/tools.json

action_surface:
  actions:
    - tool: lookup_case
      effect: read
      authority:
        mode: none
    - tool: summarize_case
      effect: read
      authority:
        mode: none
