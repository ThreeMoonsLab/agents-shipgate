version: "0.1"

project:
  name: support-refund-agent
  owner: support-platform
  repo: github.com/acme/support-refund-agent

agent:
  name: refund-assistant
  sdk:
    type: openai-agents
    language: python
    entrypoint: agents/refund_agent.py
    object: refund_agent
    static_extract: true
    deep_import: false
  declared_purpose:
    - answer refund policy questions
    - prepare refund requests for human review
    - update support ticket notes
  prohibited_actions:
    - issue refund without approval
    - cancel order without explicit confirmation
    - send external email without preview

environment:
  target: production_like
  promotion_from: staging
  promotion_to: production_like

tool_sources:
  - id: support_openapi
    type: openapi
    path: specs/support-tools.openapi.yaml
    trust: internal
  - id: support_mcp_tools
    type: mcp
    path: .agents-shipgate/mcp-tools.json
    trust: internal
  - id: wildcard_mcp_tools
    type: mcp
    path: .agents-shipgate/wildcard-tools.json
    trust: internal
  - id: openai_sdk_static
    type: openai_agents_sdk
    path: agents/refund_agent.py
    mode: static
    optional: true
  - id: reviewed_sdk_inventory
    type: mcp
    path: inventories/sdk-tools.json

tool_identity:
  bindings:
    - id: sdk_send_email_preview
      provider: openai_sdk_static
      reason: reviewed inventory describes the statically bound SDK function
      primary: {source_id: reviewed_sdk_inventory, tool: send_email_preview}
      members:
        - {source_id: openai_sdk_static, tool: send_email_preview}
        - {source_id: reviewed_sdk_inventory, tool: send_email_preview}

agent_bindings:
  root:
    source_id: openai_sdk_static
    object: refund_agent
  declarations:
    - agent: root
      complete: true
      tools:
        - {tool: support.search_kb, provider: support_mcp_tools}
        - {tool: gmail.send_customer_email, provider: support_mcp_tools}
        - {tool: refund_status_lookup, provider: support_openapi}
        - {tool: zendesk.update_ticket, provider: support_openapi}
        - {tool: shopify.cancel_order, provider: support_openapi}
        - {tool: stripe.create_refund, provider: support_openapi}
        - {tool: send_email_preview, provider: openai_sdk_static}
      handoffs: []
      reason: reviewed multi-provider fixture binding

policies:
  require_approval_for_tools:
    - tool: shopify.cancel_order
      reason: destructive_customer_action
  require_confirmation_for_tools:
    - shopify.cancel_order
  require_idempotency_for_tools:
    - shopify.cancel_order

permissions:
  scopes:
    - zendesk:tickets:read
    - zendesk:tickets:write
    - stripe:*
  credential_mode: service_account
  notes: "User-delegated identity is not implemented in this sample."

risk_overrides:
  tools:
    refund_status_lookup:
      tags: ["read_only"]
      remove_tags: ["financial_action"]
      confidence: manual
      reason: "Despite name containing refund, this is a read-only lookup."
    stripe.create_refund:
      tags: ["external_write", "financial_action"]
      owner: payments-platform
      confidence: manual
      reason: "Creates real payment refunds."
    gmail.send_customer_email:
      tags: ["external_write", "customer_communication"]
      remove_tags: ["financial_action"]
      owner: support-platform
      confidence: manual
      reason: "Communicates refund status but cannot move funds."

action_surface:
  actions:
    - tool: support.search_kb
      effect: read
      # The name heuristic reads "refund" in this tool and infers a financial
      # write. It searches the knowledge base and writes nothing, so the
      # reviewed effect stands and the override records that decision.
      override:
        evidence: [financial_write]
        reason: Read-only knowledge-base search; the refund wording is topical.
      scopes: [support:kb:read]
      authority:
        mode: scoped
        auth_type: oauth2
        credential_mode: service_account
    - tool: gmail.send_customer_email
      effect: external_communication
      scopes: [gmail:send]
      authority:
        mode: scoped
        auth_type: oauth2
        credential_mode: service_account
    - tool: refund_status_lookup
      effect: read
      authority:
        mode: unscoped
        auth_type: oauth2
        credential_mode: service_account
        reason: OpenAPI operation authenticates without an enumerable scope
    - tool: zendesk.update_ticket
      effect: write
      scopes: [zendesk:tickets:write]
      authority:
        mode: scoped
        auth_type: oauth2
        credential_mode: service_account
    - tool: shopify.cancel_order
      effect: destructive
      scopes: [shopify:orders:write]
      authority:
        mode: scoped
        auth_type: oauth2
        credential_mode: service_account
      approval:
        required: true
      safeguards:
        idempotency: true
        rollback: true
    - tool: stripe.create_refund
      effect: financial_write
      scopes: [stripe:refunds:write]
      authority:
        mode: scoped
        auth_type: oauth2
        credential_mode: service_account
    - tool: send_email_preview
      effect: read
      override:
        evidence: [external_communication]
        reason: Renders a draft for the agent to show; gmail.send_customer_email delivers.
      authority:
        mode: none

checks:
  ignore:
    - check_id: SHIP-SCHEMA-BROAD-FREE-TEXT
      tool: support.search_kb
      reason: "Search query intentionally accepts free text."

ci:
  mode: advisory
  pr_comment: true
  annotations: false
  upload_artifact: true

output:
  directory: agents-shipgate-reports
  formats:
    - markdown
    - json
