version: "0.1"

project:
  name: simple-anthropic-agent
  owner: support-platform

agent:
  name: anthropic-refund-assistant
  prohibited_actions:
    - issue refund without approval
    - send customer email without confirmation

environment:
  target: production_like

anthropic:
  prompt_files:
    - prompts/support_refund.md

  tools:
    - path: tools/anthropic-tools.json

  policy_rules:
    - path: policies/anthropic-policy.yaml

agent_bindings:
  declarations:
    - agent: root
      complete: true
      tools:
        - {tool: create_refund}
        - {tool: get_help_article}
      handoffs: []
      reason: reviewed Anthropic Messages fixture binding

action_surface:
  actions:
    - tool: create_refund
      effect: financial_write
      authority:
        mode: unscoped
        auth_type: api_key
        credential_mode: service_account
        reason: tool artifact declares authentication but no enumerable scopes
    - tool: get_help_article
      effect: read
      authority:
        mode: unscoped
        auth_type: api_key
        credential_mode: service_account
        reason: help-center binding uses an API credential without scoped grants

ci:
  mode: advisory

output:
  directory: agents-shipgate-reports
  formats:
    - markdown
    - json
