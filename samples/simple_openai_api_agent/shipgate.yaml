version: "0.1"

project:
  name: simple-openai-api-agent
  owner: support-platform

agent:
  name: api-refund-assistant
  prohibited_actions:
    - issue refund without approval
    - send customer email without confirmation

environment:
  target: production_like

openai_api:
  prompt_files:
    - prompts/support_refund.md

  tools:
    - path: tools/openai-tools.json

  response_formats:
    - path: schemas/refund_decision.schema.json
      downstream_critical_fields:
        - decision
        - refund_amount

  model_config:
    path: openai-config.json

  test_cases:
    - path: tests/openai-api-cases.json

  trace_samples:
    - path: traces/sample.jsonl

  policy_rules:
    - path: policies/openai-api-policy.yaml

action_surface:
  actions:
    - tool: create_refund
      effect: financial_write
      authority:
        mode: unscoped
        auth_type: api_key
        credential_mode: service_account
        reason: function artifact does not enumerate provider scopes
    - tool: send_customer_email
      effect: external_communication
      authority:
        mode: unscoped
        auth_type: api_key
        credential_mode: service_account
        reason: function artifact does not enumerate provider scopes

ci:
  mode: advisory

output:
  directory: agents-shipgate-reports
  formats:
    - markdown
    - json
