version: "0.1"

project:
  name: openai-agents-sdk-agent

agent:
  name: support-sdk-assistant
  sdk:
    type: openai-agents
    language: python
    entrypoint: agents
    object: support_assistant
    static_extract: true
    deep_import: false
  declared_purpose:
    - look up support cases
    - draft support replies for human review

environment:
  target: local

tool_sources:
  - id: openai_sdk_directory
    type: openai_agents_sdk
    path: agents
    mode: static
  # The AST adapter remains exercised, while this reviewed inventory proves
  # the complete bound tool surface used for release gating.
  - id: reviewed_sdk_inventory
    type: mcp
    path: inventories/tools.json

tool_identity:
  bindings:
    - id: sdk_lookup_case
      provider: openai_sdk_directory
      reason: reviewed MCP inventory describes the bound SDK function
      primary: {source_id: reviewed_sdk_inventory, tool: support.lookup_case}
      members:
        - {source_id: openai_sdk_directory, tool: support.lookup_case}
        - {source_id: reviewed_sdk_inventory, tool: support.lookup_case}
    - id: sdk_render_reply
      provider: openai_sdk_directory
      reason: reviewed MCP inventory describes the bound SDK function
      primary: {source_id: reviewed_sdk_inventory, tool: support.render_reply}
      members:
        - {source_id: openai_sdk_directory, tool: support.render_reply}
        - {source_id: reviewed_sdk_inventory, tool: support.render_reply}

action_surface:
  actions:
    - tool: support.lookup_case
      effect: read
      authority:
        mode: none
    - tool: support.render_reply
      effect: read
      authority:
        mode: none

checks:
  ignore:
    - check_id: SHIP-SCHEMA-FREEFORM-OUTPUT
      tool: support.render_reply
      reason: "Fixture keeps a string draft output to exercise SDK extraction."
