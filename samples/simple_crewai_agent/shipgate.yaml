version: "0.1"

project:
  name: simple-crewai-agent

agent:
  name: support-case-crew
  declared_purpose:
    - look up and summarize read-only support case metadata

environment:
  target: local

tool_sources:
  - id: crewai_agent
    type: crewai
    path: crew.py

crewai:
  # Explicit reviewed inventory resolves the prebuilt FileReadTool stub and
  # the AST-only binding without claiming its ambient filesystem authority is
  # safe for unattended use.
  tool_inventories:
    - inventories/tools.json

tool_identity:
  bindings:
    - id: crewai_lookup_case
      provider: crewai_agent
      reason: reviewed inventory describes the bound CrewAI class tool
      primary: {source_id: "crewai_inventory:inventories/tools.json", tool: lookup_case}
      members:
        - {source_id: crewai_agent, tool: lookup_case}
        - {source_id: "crewai_inventory:inventories/tools.json", tool: lookup_case}
    - id: crewai_summarize_case
      provider: crewai_agent
      reason: reviewed inventory describes the bound CrewAI function
      primary: {source_id: "crewai_inventory:inventories/tools.json", tool: summarize_case}
      members:
        - {source_id: crewai_agent, tool: summarize_case}
        - {source_id: "crewai_inventory:inventories/tools.json", tool: summarize_case}
    - id: crewai_file_read
      provider: crewai_agent
      reason: reviewed inventory describes the mounted prebuilt tool
      primary: {source_id: "crewai_inventory:inventories/tools.json", tool: FileReadTool}
      members:
        - {source_id: crewai_agent, tool: FileReadTool}
        - {source_id: "crewai_inventory:inventories/tools.json", tool: FileReadTool}

action_surface:
  actions:
    - tool: lookup_case
      effect: read
      authority:
        mode: none
    - tool: summarize_case
      effect: read
      authority:
        mode: none
    - tool: FileReadTool
      effect: read
      authority:
        mode: ambient
        reason: uses the host process filesystem authority
