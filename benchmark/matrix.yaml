# v1 adoption-harness matrix (24 paid Claude cells + Cursor-static parallels).
#
# 4 archetypes × 3 variants × 2 prompts × 1 agent = 24 paid cells.
# The same 24 (archetype, variant, prompt) tuples also run free under
# cursor-static, scored only on activation-class criteria.
#
# Phase-2 expansion adds Codex CLI, 6 variants, and re-sampling. Edit the
# cells list below to expand.

benchmark_schema_version: "0.2"

cells:
