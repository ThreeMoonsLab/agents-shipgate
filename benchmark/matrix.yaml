# v1 adoption-harness matrix.
#
# - 24 paid Claude-Code cells: 4 archetypes × 3 variants ({00, 10, 40}) × 2
#   prompts ({01-prepare-for-release, 04-docs-only-negative}). The 40 cells
#   omit the docs-only-negative overlay because TRIGGER-EXISTING-MANIFEST-
#   PRESENT defines force_run, which is incompatible with the "not noisy"
#   exit criterion.
#
# - 12 free cursor-static cells: 4 archetypes × {00-no-hints,
#   30-cursor-rule (positive), 30-cursor-rule + 60-docs-only-negative}.
#   Cursor coverage is intentionally a different variant subset from Claude
#   — the Cursor static driver only meaningfully scores the 30 rule
#   activation, so we run 30 (and its docs-only composition) plus a 00
#   baseline. Variants 10 and 40 are not exercised by cursor-static.
#
# Phase-2 expansion adds Codex CLI, 6 variants, and re-sampling. Edit the
# cells list below to expand.

benchmark_schema_version: "0.2"

cells:
  # ----- 00-no-hints (baseline discovery) --------------------------------
  - {archetype: openai-agents-sdk, variant: 00-no-hints, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: openai-agents-sdk, variant: 00-no-hints, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7, negative_overlay: 60-docs-only-negative}
  - {archetype: mcp-only,          variant: 00-no-hints, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: mcp-only,          variant: 00-no-hints, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7, negative_overlay: 60-docs-only-negative}
  - {archetype: openapi-only,      variant: 00-no-hints, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: openapi-only,      variant: 00-no-hints, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7, negative_overlay: 60-docs-only-negative}
  - {archetype: n8n,               variant: 00-no-hints, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: n8n,               variant: 00-no-hints, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7, negative_overlay: 60-docs-only-negative}

  # ----- 10-agents-md (target-snippet uplift) ----------------------------
  - {archetype: openai-agents-sdk, variant: 10-agents-md, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: openai-agents-sdk, variant: 10-agents-md, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7, negative_overlay: 60-docs-only-negative}
  - {archetype: mcp-only,          variant: 10-agents-md, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: mcp-only,          variant: 10-agents-md, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7, negative_overlay: 60-docs-only-negative}
  - {archetype: openapi-only,      variant: 10-agents-md, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: openapi-only,      variant: 10-agents-md, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7, negative_overlay: 60-docs-only-negative}
  - {archetype: n8n,               variant: 10-agents-md, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: n8n,               variant: 10-agents-md, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7, negative_overlay: 60-docs-only-negative}

  # ----- 40-shipgate-yaml (existing-manifest activation) -----------------
  # No 60-docs-only-negative cells here: excluded per matrix.py::EXCLUDED_PAIRS
  # because TRIGGER-EXISTING-MANIFEST-PRESENT defines force_run.
  - {archetype: openai-agents-sdk, variant: 40-shipgate-yaml, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: openai-agents-sdk, variant: 40-shipgate-yaml, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7}
  - {archetype: mcp-only,          variant: 40-shipgate-yaml, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: mcp-only,          variant: 40-shipgate-yaml, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7}
  - {archetype: openapi-only,      variant: 40-shipgate-yaml, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: openapi-only,      variant: 40-shipgate-yaml, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7}
  - {archetype: n8n,               variant: 40-shipgate-yaml, prompt: 01-prepare-for-release, agent: claude-code, model: claude-opus-4-7}
  - {archetype: n8n,               variant: 40-shipgate-yaml, prompt: 04-docs-only-negative,  agent: claude-code, model: claude-opus-4-7}

  # ----- cursor-static parallels (free, activation-only) -----------------
  # The static driver lints the Cursor rule against the canonical snippet
  # and the archetype's trigger files. Only `discovers_relevance` and the
  # cursor-specific verdict are scored; runs_* and blocker detectors are
  # marked N/A by the scorer (no command execution under a static lint).
  - {archetype: openai-agents-sdk, variant: 00-no-hints,      prompt: 01-prepare-for-release, agent: cursor-static}
  - {archetype: openai-agents-sdk, variant: 30-cursor-rule,   prompt: 01-prepare-for-release, agent: cursor-static}
  - {archetype: openai-agents-sdk, variant: 30-cursor-rule,   prompt: 04-docs-only-negative,  agent: cursor-static, negative_overlay: 60-docs-only-negative}
  - {archetype: mcp-only,          variant: 00-no-hints,      prompt: 01-prepare-for-release, agent: cursor-static}
  - {archetype: mcp-only,          variant: 30-cursor-rule,   prompt: 01-prepare-for-release, agent: cursor-static}
  - {archetype: mcp-only,          variant: 30-cursor-rule,   prompt: 04-docs-only-negative,  agent: cursor-static, negative_overlay: 60-docs-only-negative}
  - {archetype: openapi-only,      variant: 00-no-hints,      prompt: 01-prepare-for-release, agent: cursor-static}
  - {archetype: openapi-only,      variant: 30-cursor-rule,   prompt: 01-prepare-for-release, agent: cursor-static}
  - {archetype: openapi-only,      variant: 30-cursor-rule,   prompt: 04-docs-only-negative,  agent: cursor-static, negative_overlay: 60-docs-only-negative}
  - {archetype: n8n,               variant: 00-no-hints,      prompt: 01-prepare-for-release, agent: cursor-static}
  - {archetype: n8n,               variant: 30-cursor-rule,   prompt: 01-prepare-for-release, agent: cursor-static}
  - {archetype: n8n,               variant: 30-cursor-rule,   prompt: 04-docs-only-negative,  agent: cursor-static, negative_overlay: 60-docs-only-negative}
