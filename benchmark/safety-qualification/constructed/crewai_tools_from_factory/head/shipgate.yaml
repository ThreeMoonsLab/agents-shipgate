version: "0.1"

project:
  name: support-case-crew

agent:
  name: support-case-crew
  declared_purpose:
    - look up and summarize support case metadata

environment:
  target: local

tool_sources:
  - id: crewai_agent
    type: crewai
    path: crew.py

crewai:
  tool_inventories:
    - path: inventories/tools.json
      source_id: crewai_agent

action_surface:
  actions:
    - tool: lookup_case
      effect: read
      authority:
        mode: none
    - tool: summarize_case
      effect: read
      authority:
        mode: none
