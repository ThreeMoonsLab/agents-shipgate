name: shipgate

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install agents-shipgate
      - run: agents-shipgate verify --config shipgate.yaml --base origin/${{ github.base_ref }} --head HEAD
