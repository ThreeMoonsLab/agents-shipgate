# Check catalog · category: policy
#
# This file is the source of truth for the 'policy' category of
# Agents Shipgate built-in checks. Loaded at import time by
# agents_shipgate.checks._metadata_loader.load_check_metadata().
#
# Field reference: agents_shipgate.schemas.checks.CheckMetadata.
# Field order in this file follows the loader's canonical layout
# (identity → severity → narrative → evidence → remediation).
# Fields equal to the model default may be omitted.
#
# After editing this file, regenerate docs/checks.json with:
#   python scripts/generate_schemas.py
# docs/checks.md is human-maintained — update it by hand when the
# user-facing prose (description/rationale/recommendation) changes.
checks:
- id: SHIP-POLICY-APPROVAL-MISSING
  default_severity: critical
  mvp_tier: core
  floor_severity: high
  description: High-risk tool lacks a declared approval policy.
  rationale: High-risk actions need explicit approval before promotion.
  fires_when: Financial/destructive/infrastructure/code-exec risk exists without approval
    policy.
  evidence_fields:
  - risk_tags
  - policy_match
  recommendation: Declare an approval policy or remove the tool.
  requires_human_review_regardless_of_patch: true
- id: SHIP-POLICY-CONFIRMATION-MISSING
  default_severity: high
  mvp_tier: core
  floor_severity: medium
  description: Destructive/external/customer-communication tool lacks a confirmation
    policy.
  rationale: Destructive and external actions should require explicit confirmation.
  fires_when: Risk tags require confirmation but no confirmation policy matches.
  evidence_fields:
  - risk_tags
  - policy_match
  recommendation: Declare confirmation policy or remove the tool.
  requires_human_review_regardless_of_patch: true
