checks:
- id: SHIP-SIDEFX-IDEMPOTENCY-MISSING
  default_severity: high
  floor_severity: medium
  description: Risky write tool lacks idempotency evidence; critical when retry is
    known.
  rationale: Retries against non-idempotent writes can duplicate financial or external
    side effects.
  fires_when: Risky write tool lacks idempotency annotation, key, or policy.
  evidence_fields:
  - risk_tags
  - retry_policy_known
  recommendation: Add idempotency evidence or policy.
  requires_human_review_regardless_of_patch: true
