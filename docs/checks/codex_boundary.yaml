# Check catalog · category: codex_boundary
#
# This file is loaded by agents_shipgate.checks._metadata_loader.
checks:
- id: SHIP-CODEX-BOUNDARY-CONFIG-PARSE-FAILED
  default_severity: medium
  floor_severity: medium
  mvp_tier: lifecycle
  requires_human_review: true
  description: Codex project configuration could not be parsed.
  rationale: A malformed Codex config prevents deterministic inspection of the
    local execution boundary, so the local agent check fails closed to review.
  fires_when: A changed repo-local .codex/config.toml or hooks.json cannot be
    parsed as TOML or JSON.
  evidence_fields: [kind, error]
  recommendation: Fix the malformed Codex config or have a human review the
    boundary change.
- id: SHIP-CODEX-BOUNDARY-UNKNOWN-PERMISSION-KEY
  default_severity: medium
  floor_severity: medium
  mvp_tier: lifecycle
  requires_human_review: true
  description: Codex permissions contain an unknown high-risk key.
  rationale: Permission-profile schema drift can change the sandbox boundary;
    unknown keys under permissions fail closed while unrelated top-level keys
    remain advisory.
  fires_when: A changed .codex/config.toml contains an unknown key below a
    permissions profile or permissions network table.
  evidence_fields: [kind, profile, key]
  recommendation: Review the unknown permission key before trusting the local
    Codex boundary.
- id: SHIP-CODEX-BOUNDARY-NETWORK-WILDCARD
  default_severity: high
  floor_severity: medium
  mvp_tier: lifecycle
  requires_human_review: true
  description: Codex network permissions allow a wildcard domain.
  rationale: Wildcard network access expands the local agent's reachable
    resources beyond a reviewable allowlist.
  fires_when: A changed Codex permission profile allows a domain containing '*'.
  evidence_fields: [kind, profile, domain, value]
  recommendation: Replace wildcard network access with explicit domains or get
    human approval.
- id: SHIP-CODEX-BOUNDARY-NETWORK-EXPANDED
  default_severity: high
  floor_severity: medium
  mvp_tier: lifecycle
  requires_human_review: true
  description: Codex network access expanded.
  rationale: Enabling workspace-write network access or full network mode
    changes the local execution boundary.
  fires_when: sandbox_workspace_write.network_access becomes true or a Codex
    permission network mode is full.
  evidence_fields: [kind, profile, value]
  recommendation: Have a human approve the expanded Codex network boundary.
- id: SHIP-CODEX-BOUNDARY-DANGER-FULL-ACCESS
  default_severity: critical
  floor_severity: high
  mvp_tier: lifecycle
  requires_human_review: true
  description: Codex full-access sandbox is selected.
  rationale: danger-full-access removes local sandbox restrictions and must not
    be silently approved by an agent.
  fires_when: sandbox_mode or default_permissions selects danger-full-access.
  evidence_fields: [kind, value]
  recommendation: Use a narrower permission profile or get explicit human
    approval.
- id: SHIP-CODEX-BOUNDARY-MCP-AUTO-APPROVE-WRITE
  default_severity: critical
  floor_severity: critical
  mvp_tier: lifecycle
  requires_human_review: true
  description: Codex auto-approves a write or destructive MCP/app tool.
  rationale: Auto-approval of write-capable external tools lets the agent take
    side-effecting actions without a review boundary.
  fires_when: A changed MCP/app tool approval mode is approve for a tool whose
    name indicates write, delete, execute, deploy, publish, payment, refund, or
    another side-effecting action.
  evidence_fields: [kind, server, tool, risky_tools]
  recommendation: Do not auto-approve write or destructive tools.
- id: SHIP-CODEX-BOUNDARY-MCP-AUTO-APPROVE-UNKNOWN
  default_severity: high
  floor_severity: medium
  mvp_tier: lifecycle
  requires_human_review: true
  description: Codex auto-approves an MCP server whose tool surface is not
    statically enumerable.
  rationale: Without an explicit tool allowlist or per-tool metadata, Shipgate
    cannot prove auto-approved MCP calls are read-only.
  fires_when: default_tools_approval_mode is approve and no risky tool can be
    proven from the local MCP config.
  evidence_fields: [kind, server, tool_names]
  recommendation: Enumerate MCP tools or keep the approval mode at prompt.
- id: SHIP-CODEX-BOUNDARY-APP-AUTO-APPROVE
  default_severity: high
  floor_severity: medium
  mvp_tier: lifecycle
  requires_human_review: true
  description: Codex app connector tool approval changed to approve.
  rationale: Connector-backed app tools are externally mediated and need human
    review before local auto-approval.
  fires_when: A changed apps.*.tools.* approval_mode is approve for a
    non-destructive-looking tool.
  evidence_fields: [kind, app, tool]
  recommendation: Review app connector approval changes before local automation.
- id: SHIP-CODEX-BOUNDARY-AGENTS-SHIPGATE-REQUIREMENT-REMOVED
  default_severity: medium
  floor_severity: medium
  mvp_tier: lifecycle
  requires_human_review: true
  description: AGENTS.md removed a Shipgate requirement.
  rationale: Agent instructions are not controls; removing gate instructions
    requires human review because semantic weakening cannot be proven safely.
  fires_when: A changed AGENTS.md/AGENTS.override.md deletes Shipgate command or
    requirement text without adding a replacement.
  evidence_fields: [kind, deleted, removed_shipgate_lines]
  recommendation: Have a human confirm the agent instructions were not weakened.
- id: SHIP-CODEX-BOUNDARY-CI-GATE-REMOVED
  default_severity: critical
  floor_severity: critical
  mvp_tier: lifecycle
  requires_human_review: true
  description: Shipgate GitHub Action no longer invokes the gate.
  rationale: Removing the local or CI gate is a direct bypass.
  fires_when: .github/workflows/agents-shipgate.yml or .yaml is deleted or no
    longer contains a Shipgate invocation.
  evidence_fields: [kind, deleted, shipgate_invocation_present]
  recommendation: Restore the Shipgate workflow or get human approval to remove
    it.
- id: SHIP-CODEX-BOUNDARY-POLICY-WEAKENED
  default_severity: critical
  floor_severity: critical
  mvp_tier: lifecycle
  requires_human_review: true
  description: Codex boundary policy was weakened.
  rationale: The policy that judges a Codex boundary change must not be weakened
    by the same change under review.
  fires_when: A changed policies/codex-boundary.shipgate.yaml deletes the policy
    file or downgrades a block/critical rule.
  evidence_fields: [kind, deleted, weakened_action, weakened_risk]
  recommendation: Restore the stricter policy or get human approval before
    weakening the local boundary gate.
- id: SHIP-CODEX-BOUNDARY-HOOK-COMMAND-CHANGED
  default_severity: high
  floor_severity: medium
  mvp_tier: lifecycle
  requires_human_review: true
  description: A Codex executable hook changed.
  rationale: Hooks execute in the agent lifecycle and can alter local behavior
    before or after tool calls.
  fires_when: A changed Codex hooks source contains a command hook.
  evidence_fields: [kind, event, command_present]
  recommendation: Review executable hooks before relying on them.
- id: SHIP-CODEX-BOUNDARY-SKILL-COMMAND-CHANGED
  default_severity: medium
  floor_severity: medium
  mvp_tier: lifecycle
  requires_human_review: true
  description: A Codex skill gained command-bearing instructions.
  rationale: Skills can steer agents into shell commands or helper scripts, so
    command-bearing changes need review before local automation.
  fires_when: A changed .agents/skills/**/SKILL.md adds command-like text.
  evidence_fields: [kind]
  recommendation: Review command-bearing skill changes before local automation.
