# Scheduled host-grant drift gate.
#
# Coding agents can change their own authority between PRs and reviews:
# a new MCP server in .mcp.json, a wildcard allow rule or a removed deny
# rule in .claude/settings.json, a workflow that gains write scopes.
# This workflow compares the repo's current host grants against the
# acknowledged baseline (.agents-shipgate/host-grants.json) on a schedule
# and fails when they drifted, so un-reviewed authority changes surface
# even when no PR is open.
#
# One-time setup (committed by a human after review):
#
#   shipgate audit --host --save-baseline
#   git add .agents-shipgate/host-grants.json && git commit
#
# After reviewing a legitimate drift, re-acknowledge the new state with
# the same command. Do not re-save to silence drift nobody reviewed.
# --save-baseline refuses to overwrite a baseline older than schema 0.6,
# which every baseline written by 1.0.0 is: move that file aside first, e.g.
#
#   git mv .agents-shipgate/host-grants.json .agents-shipgate/host-grants.v0.5.json
#   shipgate audit --host --save-baseline
#
# Upgrading past 1.0.0 can drift once. Claude Code hook files nothing selects
# now read as `access: unknown` (#714), with no expansion signal, and plugin
# manifests, marketplaces and the hook files they select are newly read: a
# newly read hook file carries a `hook_added` signal only when the repository's
# project settings enable that plugin. A repository whose plugin manifest or
# marketplace declares `hooks` drifts once even when no grant changes: the
# manifest is a new artifact and a new observed source, so this gate exits 20
# reporting "0 typed grant change(s)" with no rows. Separately, a 0.4 or 0.5
# baseline holding a workflow grant is incomparable after #771 (see STABILITY.md).
# Read `changes`, `artifact_changes` and `coverage_changes` with
# `shipgate audit --host --drift --json` before re-saving, and move the old
# baseline aside as above, because it predates schema 0.6.

name: host-grant-drift

on:
  schedule:
    - cron: "17 6 * * 1-5" # weekday mornings UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agents-shipgate (pinned)
        run: python -m pip install "agents-shipgate==1.1.0"

      - name: Compare host grants against the acknowledged baseline
        run: |
          shipgate audit --host --drift --fail-on-drift
          # Exit 20 on drift fails the job; the step log contains the
          # one-page drift report with expansion signals. For machine
          # consumption add --json and upload the payload as an artifact.
