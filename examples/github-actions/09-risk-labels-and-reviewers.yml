# Route reviewer attention from Shipgate outputs: label the PR by risk
# signal and request reviewers when a trust root was touched.
#
# Labels applied (create them once in the repo, any color):
#   agent-capability-change  — the diff added/changed/removed capabilities
#   trust-root-touched       — manifest/CI/agent-instruction surface changed
#   shipgate-blocked         — merge verdict is blocked
#
# Set TRUST_ROOT_REVIEWERS to the team/users who own the release boundary.
name: Agents Shipgate (risk labels + reviewers)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  shipgate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: shipgate
        uses: ThreeMoonsLab/agents-shipgate@v0.12.0
        with:
          config: shipgate.yaml
          ci_mode: advisory
          diff_base: target
          pr_comment: 'true'
          shipgate_version: '0.12.0'
      - name: Apply risk labels and request reviewers
        if: always()
        uses: actions/github-script@v7
        env:
          MERGE_VERDICT: ${{ steps.shipgate.outputs.merge_verdict }}
          TRUST_ROOT_TOUCHED: ${{ steps.shipgate.outputs.trust_root_touched }}
          CAP_ADDED: ${{ steps.shipgate.outputs.capability_changes_added }}
          CAP_MODIFIED: ${{ steps.shipgate.outputs.capability_changes_modified }}
          CAP_REMOVED: ${{ steps.shipgate.outputs.capability_changes_removed }}
          # Comma-separated GitHub logins; team reviewers need a fuller token.
          TRUST_ROOT_REVIEWERS: ''
        with:
          script: |
            const labels = [];
            const capTotal =
              Number(process.env.CAP_ADDED || 0) +
              Number(process.env.CAP_MODIFIED || 0) +
              Number(process.env.CAP_REMOVED || 0);
            if (capTotal > 0) labels.push('agent-capability-change');
            if (process.env.TRUST_ROOT_TOUCHED === 'true') labels.push('trust-root-touched');
            if (process.env.MERGE_VERDICT === 'blocked') labels.push('shipgate-blocked');
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
            const reviewers = (process.env.TRUST_ROOT_REVIEWERS || '')
              .split(',').map((s) => s.trim()).filter(Boolean)
              .filter((login) => login !== context.payload.pull_request.user.login);
            if (process.env.TRUST_ROOT_TOUCHED === 'true' && reviewers.length) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers,
              });
            }
