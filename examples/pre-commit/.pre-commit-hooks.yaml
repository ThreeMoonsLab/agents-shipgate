# Agents Shipgate pre-commit hook recipe.
#
# Drop this entry into a target repo's .pre-commit-config.yaml under the
# `repos:` list with `repo: local`, OR (recommended) install via the
# canonical pip dependency and reference the hook id directly.
#
# Local form (no extra package install needed; pre-commit invokes the
# `agents-shipgate` binary already on PATH):
#
#   repos:
#     - repo: local
#       hooks:
#         - id: agents-shipgate
#           name: Agents Shipgate release-readiness gate
#           entry: agents-shipgate scan -c shipgate.yaml --ci-mode advisory
#           language: system
#           pass_filenames: false
#           files: |
#             (?x)^(
#               shipgate\.yaml|
#               .*tools.*\.json|
#               .*mcp.*\.json|
#               .*openapi.*\.(yaml|yml|json)|
#               prompts/.*|
#               policies/.*
#             )$
#
# Canonical form (let pre-commit manage the agents-shipgate install):
#
#   repos:
#     - repo: https://github.com/ThreeMoonsLab/agents-shipgate
#       rev: v0.10.0
#       hooks:
#         - id: agents-shipgate
#
# When using the canonical form, pre-commit reads the entry below.
- id: agents-shipgate
  name: Agents Shipgate release-readiness gate
  description: >
    Static release-readiness scan for AI agent tool surfaces. Fires only
    when a staged change touches `shipgate.yaml`, an MCP/OpenAPI/tool
    inventory artifact, or `prompts/` / `policies/`. Advisory mode by
    default — never blocks the commit; switch to strict via
    `entry: agents-shipgate scan -c shipgate.yaml --ci-mode strict`.
  entry: agents-shipgate scan -c shipgate.yaml --ci-mode advisory
  language: python
  pass_filenames: false
  always_run: false
  # Globs encoded as a Python-verbose regex so the hook fires only when a
  # tool-surface artifact actually changed. Matches the AGENTS.md trigger
  # table; mirrors `docs/triggers.json`'s glob set so prose, hook, and
  # machine-readable triggers stay in sync.
  files: |
    (?x)^(
      shipgate\.yaml|
      .*tools.*\.json|
      .*mcp.*\.json|
      .*openapi.*\.(yaml|yml|json)|
      .*swagger.*\.(yaml|yml|json)|
      \.agents-shipgate/.*\.json|
      prompts/.*|
      policies/.*
    )$
  minimum_pre_commit_version: "3.0.0"
  additional_dependencies:
    - agents-shipgate
