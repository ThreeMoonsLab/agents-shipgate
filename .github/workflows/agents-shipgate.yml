name: Agents Shipgate

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: ./
        with:
          config: shipgate.yaml
          ci_mode: advisory
          diff_base: target
          fail_on_decisions: block
          upload_artifact: "true"
          pr_comment: "false"
