name: Release

on:
  push:
    tags:
      - "v*"

# No ambient authority. Each job requests the minimum it needs: verification
# gets read-only via the reusable workflow, and only `publish` holds the
# `contents: write` and `id-token: write` that can mutate anything outside
# this run.
permissions: {}

# Serialised across the PyPI project rather than per tag. Two different tags
# racing to publish the same distribution is exactly the case a per-tag group
# would allow. `cancel-in-progress: false` because a half-finished publication
# transaction must be allowed to reach its finalisation step; cancelling it is
# how PyPI ends up holding a version with no corresponding GitHub Release.
concurrency:
  group: release-publish-agents-shipgate
  cancel-in-progress: false

jobs:
  verify:
    name: Verify candidate
    permissions:
      contents: read
    uses: ./.github/workflows/release-verify.yml
    with:
      ref: ${{ github.ref }}
      release_tag: ${{ github.ref_name }}
      mode: release

  publish:
    name: Publish candidate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The human gate sits here rather than on verification. Reviewers now
    # approve *after* the readiness summary exists, instead of approving a run
    # whose evidence has not been produced yet.
    environment: pypi
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install publication tooling
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "uv==0.11.7"

      - name: Download verified candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: dist

      - name: Verify the candidate handoff
        # The expected digest arrives through the job-output channel, not the
        # artifact store, so swapping a file in the store — or rewriting the
        # manifest to agree with the swap — breaks one of the links.
        env:
          MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
        run: |
          python scripts/release_publication.py verify-manifest \
            --manifest dist/candidate-manifest.json \
            --expected-sha256 "${MANIFEST_SHA256}"

      - name: Re-verify the wheel-scoped SBOM binding
        env:
          WHEEL_FILENAME: ${{ needs.verify.outputs.wheel_filename }}
        run: |
          python scripts/release_sbom.py verify \
            --wheel "dist/${WHEEL_FILENAME}" \
            --sbom dist/agents-shipgate-sbom.json

      - name: Sign release artifacts
        env:
          WHEEL_FILENAME: ${{ needs.verify.outputs.wheel_filename }}
        run: |
          sigstore sign --output-directory dist --overwrite \
            "dist/${WHEEL_FILENAME}" \
            dist/agents-shipgate-sbom.json

      - name: Create draft GitHub release
        # Created before the immutable PyPI upload and carrying the
        # authoritative assets, so a failure anywhere after publication leaves
        # a discoverable draft to finish from rather than a published version
        # with nothing attached.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          set -euo pipefail
          # `v1.2.3` is a final release; anything else (v0.16.0b7, rc, a) is a
          # pre-release and must not be promoted to "Latest".
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            maturity="--latest"
          else
            maturity="--prerelease"
          fi
          echo "RELEASE_MATURITY=${maturity}" >> "${GITHUB_ENV}"
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; re-uploading assets to the existing draft."
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --draft \
              "${maturity}" \
              --title "${RELEASE_TAG}" \
              --notes "Agents Shipgate ${RELEASE_TAG}"
          fi

      - name: Classify index state
        id: index
        env:
          WHEEL_FILENAME: ${{ needs.verify.outputs.wheel_filename }}
        run: |
          python scripts/release_publication.py pypi-state \
            --wheel "dist/${WHEEL_FILENAME}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Publish to PyPI with Trusted Publishing
        # Skipped when the index already holds these exact bytes, which is what
        # a re-run after a post-publication failure looks like. The state check
        # hard-fails if the version exists with *different* bytes, so this can
        # never quietly succeed against a divergent artifact.
        if: steps.index.outputs.should_publish == 'true'
        env:
          WHEEL_FILENAME: ${{ needs.verify.outputs.wheel_filename }}
        run: uv publish --trusted-publishing always "dist/${WHEEL_FILENAME}"

      - name: Confirm the index holds the verified bytes
        env:
          WHEEL_FILENAME: ${{ needs.verify.outputs.wheel_filename }}
        run: |
          python scripts/release_publication.py pypi-state \
            --wheel "dist/${WHEEL_FILENAME}" | tee /dev/stderr | grep -q "published_identical"

      - name: Validate release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
          WHEEL_FILENAME: ${{ needs.verify.outputs.wheel_filename }}
        run: |
          set -euo pipefail
          attached="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          for required in \
            "${WHEEL_FILENAME}" \
            agents-shipgate-sbom.json \
            safety-qualification.json \
            provenance.json \
            candidate-manifest.json
          do
            if ! printf '%s\n' "${attached}" | grep -qx -- "${required}"; then
              echo "::error::Release ${RELEASE_TAG} is missing required asset ${required}."
              exit 1
            fi
          done
          echo "OK: all required assets are attached to ${RELEASE_TAG}."

      - name: Finalise GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: gh release edit "${RELEASE_TAG}" --draft=false "${RELEASE_MATURITY}"
