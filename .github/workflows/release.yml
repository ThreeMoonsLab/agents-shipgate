name: Release

on:
  push:
    tags:
      - "v*"

# No ambient authority. Each job requests the minimum it needs, and the two
# dangerous capabilities are never held together: `publish` can mint a PyPI
# token but cannot write to the repository, and `stage`/`finalize` can write to
# the repository but cannot mint a token.
permissions: {}

# Serialised across the PyPI project rather than per tag. Two different tags
# racing to publish the same distribution is exactly the case a per-tag group
# would allow. `cancel-in-progress: false` because a half-finished publication
# transaction must be allowed to reach its finalisation step; cancelling it is
# how PyPI ends up holding a version with no corresponding GitHub Release.
concurrency:
  group: release-publish-agents-shipgate
  cancel-in-progress: false

jobs:
  channel:
    name: Resolve the declared release channel
    # Which line this tag publishes on is decided here, from the declaration
    # committed at the tagged commit, before anything is built (#648). Choosing
    # by what verification happens to find — whether a qualification artifact
    # downloads — would let a qualified release whose download broke publish
    # as advisory, and PyPI never gives a version back.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Check out only the channel declaration and its reader
        # Standard-library scripts and one JSON file, at the immutable SHA of
        # the push event.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/release-channels.json
            scripts/_release_support.py
            scripts/release_channel.py
            scripts/release_publication.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Read the channel reviewed code declares for this version
        id: channel
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_channel.py resolve --tag "${RELEASE_TAG}"

  verify:
    name: Verify qualified candidate
    needs: channel
    # Exactly one of `verify` and `verify_advisory` runs, chosen by the
    # declaration. They call separate workflow files, so the advisory line
    # skips no qualification step inside the qualified workflow: it calls one
    # that has none (Amendment 2, C3; Amendment 5).
    if: needs.channel.outputs.channel == 'qualified'
    permissions:
      contents: read
    uses: ./.github/workflows/release-verify.yml
    with:
      # The immutable SHA of the push event, never `github.ref`. A symbolic ref
      # is re-resolved by the checkout action, so a tag moved between the event
      # and the checkout would build commit B while provenance recorded A.
      ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
      mode: release

  verify_advisory:
    name: Verify advisory candidate
    needs: channel
    if: needs.channel.outputs.channel == 'advisory'
    permissions:
      contents: read
      # Read-only: locates and downloads the Release Engine Smoke run that
      # exercised this exact candidate (#570).
      actions: read
    uses: ./.github/workflows/release-advisory-verify.yml
    with:
      # The immutable SHA of the push event, for the reason given on `verify`.
      ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}
      mode: release

  candidate:
    name: Confirm exactly the declared verification ran
    needs: [channel, verify, verify_advisory]
    # One verification job is always skipped, and a skipped dependency skips
    # every job downstream of it unless a condition says otherwise. So this job
    # runs whenever the channel resolved, and `release_channel.py candidate`,
    # not this condition, decides: the declared job must have succeeded, the
    # other must have stayed skipped and exported nothing, and every value
    # publication reads must be present and bound to the pushed tag. Every job
    # after this one names each of its dependencies' success explicitly.
    if: ${{ !cancelled() && needs.channel.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.select.outputs.channel }}
      version: ${{ steps.select.outputs.version }}
      release_tag: ${{ steps.select.outputs.release_tag }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      wheel_filename: ${{ steps.select.outputs.wheel_filename }}
      wheel_sha256: ${{ steps.select.outputs.wheel_sha256 }}
      manifest_sha256: ${{ steps.select.outputs.manifest_sha256 }}
      release_notes_sha256: ${{ steps.select.outputs.release_notes_sha256 }}
      artifact_name: ${{ steps.select.outputs.artifact_name }}
      rehearsal_workflow: ${{ steps.select.outputs.rehearsal_workflow }}
      release_assets: ${{ steps.select.outputs.release_assets }}
      signed_assets: ${{ steps.select.outputs.signed_assets }}
    steps:
      - name: Check out only the channel reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/_release_support.py
            scripts/release_channel.py
            scripts/release_publication.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Select the declared channel's verified candidate
        id: select
        env:
          CHANNEL: ${{ needs.channel.outputs.channel }}
          RELEASE_TAG: ${{ github.ref_name }}
          QUALIFIED_RESULT: ${{ needs.verify.result }}
          ADVISORY_RESULT: ${{ needs.verify_advisory.result }}
          QUALIFIED_OUTPUTS: ${{ toJSON(needs.verify.outputs) }}
          ADVISORY_OUTPUTS: ${{ toJSON(needs.verify_advisory.outputs) }}
        run: |
          python scripts/release_channel.py candidate \
            --channel "${CHANNEL}" \
            --tag "${RELEASE_TAG}" \
            --qualified-result "${QUALIFIED_RESULT}" \
            --advisory-result "${ADVISORY_RESULT}" \
            --qualified-outputs "${QUALIFIED_OUTPUTS}" \
            --advisory-outputs "${ADVISORY_OUTPUTS}"

  stage:
    name: Stage release
    needs: candidate
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      should_publish: ${{ steps.index.outputs.should_publish }}
      index_state: ${{ steps.index.outputs.state }}
      release_state: ${{ steps.release.outputs.release_state }}
    steps:
      - name: Checkout the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the hash-locked verification toolchain
        # Needed to verify signature bundles on an already-published release.
        # Same constrained install as the other publication-side jobs: this job
        # can rewrite a public release, so what it installs is constrained by
        # choice as well as by digest.
        uses: ./.github/actions/install-release-toolchain
        with:
          lockfile-url: https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.candidate.outputs.source_sha }}/constraints/release-publish.txt

      - name: Confirm the tag still points at the verified commit
        # Guards a tag moved (or deleted and recreated) after verification.
        # `^{}` peels annotated tags to the commit they name.
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          if [ -z "${peeled}" ]; then
            peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | cut -f1)"
          fi
          if [ "${peeled}" != "${SOURCE_SHA}" ]; then
            echo "::error::Tag ${RELEASE_TAG} now points at ${peeled:-<missing>}, not the verified ${SOURCE_SHA}."
            exit 1
          fi
          echo "OK: ${RELEASE_TAG} still resolves to ${SOURCE_SHA}."

      - name: Require a successful rehearsal of this exact candidate
        # #355 made rehearsal mandatory in the runbook; this makes it a
        # precondition the pipeline enforces. Matching on `head_sha` binds both
        # the source and the workflow revision, because they are the same tree.
        # Comparing the rehearsed manifest byte-for-byte additionally binds
        # candidate identity, so a qualification artifact swapped between the
        # rehearsal and the tag is caught here.
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
          ARTIFACT_NAME: ${{ needs.candidate.outputs.artifact_name }}
          # The declared channel's rehearsal file: `release-rehearsal.yml` for
          # the qualified line, `release-advisory-rehearsal.yml` for the
          # advisory one, so neither line's rehearsal satisfies the other.
          REHEARSAL_WORKFLOW: ${{ needs.candidate.outputs.rehearsal_workflow }}
        run: |
          set -euo pipefail
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${REHEARSAL_WORKFLOW:?the candidate names no rehearsal workflow}/runs?head_sha=${SOURCE_SHA}&status=success&per_page=100" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "${run_id}" ]; then
            echo "::error::No successful ${REHEARSAL_WORKFLOW} run for ${SOURCE_SHA}. Rehearse the candidate before tagging; see docs/release-runbook.md."
            exit 1
          fi
          echo "Rehearsal run: ${run_id}"
          gh run download "${run_id}" --name "${ARTIFACT_NAME}" --dir rehearsed
          echo "REHEARSAL_RUN_ID=${run_id}" >> "${GITHUB_ENV}"

      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: dist

      - name: Verify the candidate handoff
        # The expected digest arrives through the job-output channel, not the
        # artifact store, so swapping a file in the store — or rewriting the
        # manifest to agree with the swap — breaks one of the links. The check
        # is closed-world: an unlisted file in `dist/` is rejected rather than
        # silently uploaded.
        env:
          MANIFEST_SHA256: ${{ needs.candidate.outputs.manifest_sha256 }}
          CHANNEL: ${{ needs.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          python scripts/release_publication.py verify-manifest \
            --manifest dist/candidate-manifest.json \
            --expected-sha256 "${MANIFEST_SHA256}" \
            --expected-channel "${CHANNEL}"
          cmp -- rehearsed/candidate-manifest.json dist/candidate-manifest.json
          echo "OK: the tagged candidate is byte-identical to the rehearsed one."

      - name: Re-verify the wheel-scoped SBOM binding
        env:
          WHEEL_FILENAME: ${{ needs.candidate.outputs.wheel_filename }}
        run: |
          python scripts/release_sbom.py verify \
            --wheel "dist/${WHEEL_FILENAME}" \
            --sbom dist/agents-shipgate-sbom.json

      - name: Extract the release notes from the CHANGELOG
        # The release page used to say "Agents Shipgate v0.16.0" while
        # CHANGELOG.md held the entry describing what actually changed. The
        # body is now that section, taken from this checkout — which is pinned
        # to the commit verification approved, not to the tag — and bound to
        # the digest verification published, so the published notes are the
        # reviewed text rather than something retyped at tag time.
        #
        # Written under `$RUNNER_TEMP`, never into the checkout: a candidate
        # that committed its own `release-notes.md` would otherwise decide
        # where this write lands, and guarding the path in this job alone would
        # let such a candidate pass the mandatory rehearsal and fail only after
        # the tag was pushed.
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          NOTES_SHA256: ${{ needs.candidate.outputs.release_notes_sha256 }}
        run: |
          python scripts/release_notes.py \
            --tag "${RELEASE_TAG}" \
            --expected-sha256 "${NOTES_SHA256}" \
            --output "${RUNNER_TEMP}/release-notes.md"

      - name: Classify index state
        id: index
        # Runs *before* anything mutates the GitHub Release, so a divergent
        # version fails with both registries untouched.
        env:
          WHEEL_FILENAME: ${{ needs.candidate.outputs.wheel_filename }}
        run: |
          python scripts/release_publication.py pypi-state \
            --wheel "dist/${WHEEL_FILENAME}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Create or repair the draft release
        id: release
        # A draft carrying the authoritative assets must exist before the
        # immutable PyPI upload, so a later failure leaves something to finish
        # from. Only drafts are ever mutated: an already-published release is
        # verified and left alone, because clobbering its assets on a re-run
        # would replace public bytes that PyPI can no longer be made to match.
        #
        # `release_state` is propagated so the downstream jobs can stand down
        # entirely rather than re-signing and re-uploading over a completed
        # transaction — Sigstore bundles are not reproducible, so re-signing a
        # published release replaces public attestations for no reason.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          WHEEL_FILENAME: ${{ needs.candidate.outputs.wheel_filename }}
          MANIFEST_SHA256: ${{ needs.candidate.outputs.manifest_sha256 }}
          NOTES_SHA256: ${{ needs.candidate.outputs.release_notes_sha256 }}
          INDEX_STATE: ${{ steps.index.outputs.state }}
          CHANNEL: ${{ needs.candidate.outputs.channel }}
          RELEASE_ASSETS: ${{ needs.candidate.outputs.release_assets }}
          SIGNED_ASSETS: ${{ needs.candidate.outputs.signed_assets }}
        run: |
          set -euo pipefail
          # `v1.2.3` is a final release; anything else (v0.16.0b7, rc, a) is a
          # pre-release and must not be promoted to "Latest".
          #
          # Maturity is applied only at finalisation. A draft cannot be marked
          # latest — GitHub rejects `draft: true` together with
          # `make_latest: true` — so requesting it at create time would fail
          # every first-time stable release here, before PyPI is touched. The
          # draft is created with the pre-release flag when applicable and no
          # latest request at all.
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            create_maturity="--latest=false"
          else
            create_maturity="--prerelease"
          fi

          # The declared channel's closed asset set, from
          # `release_publication.CHANNEL_ASSETS` by way of `candidate`. The
          # handoff check above has already refused a `dist/` holding any other.
          read -r -a channel_assets <<< "${RELEASE_ASSETS:?the candidate names no release assets}"
          read -r -a signed_assets <<< "${SIGNED_ASSETS:?the candidate names no signed assets}"
          assets=("dist/${WHEEL_FILENAME}")
          for asset in "${channel_assets[@]}"; do
            assets+=("dist/${asset}")
          done
          assets+=(dist/candidate-manifest.json)

          if ! gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --draft \
              --verify-tag \
              "${create_maturity}" \
              --title "${RELEASE_TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
            echo "release_state=absent" >> "${GITHUB_OUTPUT}"
            echo "Created draft release ${RELEASE_TAG}."
            exit 0
          fi

          if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = "true" ]; then
            # Repair replaces the notes too. A draft left by an earlier attempt
            # can carry a body from a superseded changelog, and finalisation
            # re-derives every asset but never looks at the release text.
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            gh release edit "${RELEASE_TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md"
            echo "release_state=draft" >> "${GITHUB_OUTPUT}"
            echo "Repaired existing draft ${RELEASE_TAG}."
            exit 0
          fi

          # Published already. Prove it carries exactly these bytes, then stop
          # touching it. Signature bundles are produced after staging, so they
          # are the only additional files permitted.
          if [ "${INDEX_STATE}" != "published_identical" ]; then
            echo "::error::Release ${RELEASE_TAG} is published on GitHub but the index state is ${INDEX_STATE}; the registries disagree. See docs/release-runbook.md."
            exit 1
          fi
          mkdir -p published
          gh release download "${RELEASE_TAG}" --dir published --clobber
          # Required, never merely allowed: declaring the transaction complete
          # makes both downstream signature-verifying jobs skip, so a release
          # missing a bundle — or carrying arbitrary bytes under the expected
          # name — must fail here rather than be waved through.
          # `--require-signatures` derives the bundles from the declared
          # channel, so they are not re-listed here.
          python scripts/release_publication.py verify-manifest \
            --manifest published/candidate-manifest.json \
            --expected-sha256 "${MANIFEST_SHA256}" \
            --expected-channel "${CHANNEL}" \
            --directory published \
            --require-signatures
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          for target in "${WHEEL_FILENAME}" "${signed_assets[@]}"; do
            sigstore verify identity \
              --bundle "published/${target}.sigstore.json" \
              --cert-identity "${identity}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              "published/${target}"
          done
          # The body is evidence too, and it is the one part of a published
          # release that stays editable. Declaring the transaction complete
          # makes `publish` and `finalize` skip, so a re-run would otherwise
          # certify text that was changed after publication and never
          # re-derived. Assets are content-addressed; this is not, so it is
          # compared here.
          gh release view "${RELEASE_TAG}" --json body --jq .body > published-body.md
          python scripts/release_notes.py \
            --tag "${RELEASE_TAG}" \
            --expected-sha256 "${NOTES_SHA256}" \
            --published-body published-body.md
          echo "release_state=published" >> "${GITHUB_OUTPUT}"
          echo "Release ${RELEASE_TAG} is already published, complete and signed; leaving it untouched."

  publish:
    name: Publish to PyPI
    needs: [candidate, stage]
    # Each dependency's success is named, never implied: see `candidate`. A
    # completed transaction is left alone. Re-signing a published release
    # would mint fresh, non-reproducible Sigstore bundles and replace the
    # public attestations for no benefit.
    if: ${{ !cancelled() && needs.candidate.result == 'success' && needs.stage.result == 'success' && needs.stage.outputs.release_state != 'published' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The human gate sits here, on the one irreversible action, and after the
    # readiness summary exists — reviewers approve with evidence rather than
    # approving a run whose evidence has not been produced yet.
    environment: pypi
    # Deliberately *only* `id-token`. This job can mint a PyPI token, so it
    # holds no repository write, checks out no project code, and installs
    # nothing but the hash-locked toolchain in constraints/release-publish.txt.
    permissions:
      id-token: write
    steps:
      - name: Check out only the toolchain installer
        # A local `./.github/actions/...` action is loaded from the workspace,
        # so a job that uses one and checks out nothing fails while *preparing*
        # the action — before any step runs. This job and `finalize` did
        # exactly that, which would have broken the first release to reach
        # publication.
        #
        # Sparse and cone-mode off, so the workspace contains the installer
        # directory and nothing else: cone mode would also materialise every
        # file at the repository root. The trust boundary is unchanged — the
        # only file checked out is the one this job already executes as an
        # action, at the commit verification approved, with no credentials
        # persisted.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/install-release-toolchain
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the hash-locked publication toolchain
        # No candidate *code* runs in this job. An earlier revision fetched
        # `release_publication.py` here and ran it before `uv publish`;
        # "standard library only" is not a trust boundary, because the file
        # still came from the candidate tree and could have rewritten the
        # wheel or requested an OIDC token directly. The index query below
        # therefore uses curl and jq, which the runner provides.
        uses: ./.github/actions/install-release-toolchain
        with:
          lockfile-url: https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.candidate.outputs.source_sha }}/constraints/release-publish.txt

      - name: Confirm the tag still points at the verified commit
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          if [ -z "${peeled}" ]; then
            peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | cut -f1)"
          fi
          if [ "${peeled}" != "${SOURCE_SHA}" ]; then
            echo "::error::Tag ${RELEASE_TAG} now points at ${peeled:-<missing>}, not the verified ${SOURCE_SHA}."
            exit 1
          fi

      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: dist

      - name: Confirm the wheel digest verification approved
        env:
          WHEEL_FILENAME: ${{ needs.candidate.outputs.wheel_filename }}
          WHEEL_SHA256: ${{ needs.candidate.outputs.wheel_sha256 }}
        run: |
          set -euo pipefail
          echo "${WHEEL_SHA256}  dist/${WHEEL_FILENAME}" | sha256sum --check --strict

      - name: Sign release artifacts
        # The wheel, and what the declared channel signs besides it: the SBOM
        # on both lines, and on the advisory line the statement saying what the
        # release does not claim. Plain shell, because this job runs no
        # project code.
        env:
          WHEEL_FILENAME: ${{ needs.candidate.outputs.wheel_filename }}
          SIGNED_ASSETS: ${{ needs.candidate.outputs.signed_assets }}
        run: |
          set -euo pipefail
          read -r -a signed_assets <<< "${SIGNED_ASSETS:?the candidate names no signed assets}"
          targets=("dist/${WHEEL_FILENAME}")
          for asset in "${signed_assets[@]}"; do
            targets+=("dist/${asset}")
          done
          sigstore sign --output-directory dist --overwrite "${targets[@]}"

      - name: Publish to PyPI with Trusted Publishing
        # The index is reclassified here rather than reusing `stage`'s result.
        # That result predates environment approval and, on "Re-run failed
        # jobs" after a post-upload step failed, would still say `absent` —
        # retrying an immutable version and never reaching recovery. Deciding
        # inside the attempt makes the three outcomes exact at the moment they
        # matter: absent -> upload, identical -> skip and continue, divergent
        # -> fail.
        env:
          WHEEL_FILENAME: ${{ needs.candidate.outputs.wheel_filename }}
          WHEEL_SHA256: ${{ needs.candidate.outputs.wheel_sha256 }}
          VERSION: ${{ needs.candidate.outputs.version }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          # Classified with curl and jq rather than a candidate-tree helper:
          # this job can mint a PyPI token, so it runs no repository code.
          url="https://pypi.org/pypi/agents-shipgate/${VERSION}/json"
          status="$(curl --silent --show-error --location --proto '=https' \
            --write-out '%{http_code}' --output index.json "${url}" || true)"

          case "${status}" in
            404) state="absent" ;;
            200)
              # Exactly one unyanked wheel, expected filename, matching digest.
              state="$(jq -r --arg f "${WHEEL_FILENAME}" --arg d "${WHEEL_SHA256}" '
                if (.urls | length) == 1
                   and .urls[0].filename == $f
                   and .urls[0].packagetype == "bdist_wheel"
                   and .urls[0].digests.sha256 == $d
                   and (.urls[0].yanked != true)
                then "published_identical" else "published_divergent" end
              ' index.json)"
              ;;
            *)
              echo "::error::Unable to query ${url}: HTTP ${status}. An unreachable index is not permission to upload."
              exit 1
              ;;
          esac
          echo "Index state: ${state}"

          case "${state}" in
            published_identical)
              echo "Index already holds these exact bytes; completing the interrupted transaction."
              exit 0
              ;;
            published_divergent)
              echo "::error::${VERSION} is already on the index with different content. PyPI uploads are immutable; cut a new version. See docs/release-runbook.md."
              exit 1
              ;;
          esac

          # Last possible moment: the tag is re-peeled immediately before the
          # irreversible upload, not several steps earlier. Everything between
          # the previous check and here (download, digest check, signing) is
          # window in which an unprotected tag could have moved.
          peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          if [ -z "${peeled}" ]; then
            peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | cut -f1)"
          fi
          if [ "${peeled}" != "${SOURCE_SHA}" ]; then
            echo "::error::Tag ${RELEASE_TAG} points at ${peeled:-<missing>}, not the verified ${SOURCE_SHA}; refusing to publish."
            exit 1
          fi
          echo "${WHEEL_SHA256}  dist/${WHEEL_FILENAME}" | sha256sum --check --strict

          uv publish --trusted-publishing always "dist/${WHEEL_FILENAME}"

      - name: Upload signatures for finalisation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-signatures-${{ needs.candidate.outputs.release_tag }}
          path: dist/*.sigstore.json
          if-no-files-found: error
          retention-days: 14

  finalize:
    name: Finalise release
    needs: [candidate, stage, publish]
    # Each dependency's success is named, never implied: see `candidate`.
    # Nothing to finalise when the transaction already completed.
    if: ${{ !cancelled() && needs.candidate.result == 'success' && needs.stage.result == 'success' && needs.publish.result == 'success' && needs.stage.outputs.release_state != 'published' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repository write, and no `id-token`: a dependency compromised here cannot
    # reach PyPI.
    permissions:
      contents: write
    steps:
      - name: Check out only the toolchain installer
        # Same reason as in `publish`: a local action must exist in the
        # workspace or the job fails while preparing it. Sparse, cone-mode off,
        # pinned to the verified commit, no credentials persisted — the
        # workspace holds the installer and nothing else, so this job still
        # runs no project code.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.candidate.outputs.source_sha }}
          persist-credentials: false
          sparse-checkout: .github/actions/install-release-toolchain
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the hash-locked verification toolchain
        uses: ./.github/actions/install-release-toolchain
        with:
          lockfile-url: https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.candidate.outputs.source_sha }}/constraints/release-publish.txt

      - name: Fetch the standard-library verification scripts
        # Fetched by immutable SHA rather than checked out: this job mutates a
        # public release, so it runs no project code. These modules import
        # nothing beyond the standard library. CHANGELOG.md comes from the same
        # immutable commit, so re-deriving the notes here reads exactly the
        # bytes verification read.
        env:
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p tools
          for path in \
            scripts/release_publication.py \
            scripts/_release_support.py \
            scripts/release_notes.py \
            CHANGELOG.md
          do
            curl --fail --location --proto '=https' --proto-redir '=https' \
              --output "tools/$(basename "${path}")" "${RAW_BASE}/${path}"
          done

      - name: Confirm the tag still points at the verified commit
        # Re-peeled before any mutation here. PyPI has the bytes for source A
        # by this point; if the tag moved to B, GitHub's source archives and
        # the release would resolve to different code than the index holds.
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          if [ -z "${peeled}" ]; then
            peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | cut -f1)"
          fi
          if [ "${peeled}" != "${SOURCE_SHA}" ]; then
            echo "::error::Tag ${RELEASE_TAG} now points at ${peeled:-<missing>}, not the verified ${SOURCE_SHA}."
            exit 1
          fi

      - name: Download verified candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: dist

      - name: Download signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-signatures-${{ needs.candidate.outputs.release_tag }}
          path: signatures

      - name: Confirm the index holds the verified bytes
        env:
          WHEEL_FILENAME: ${{ needs.candidate.outputs.wheel_filename }}
        run: |
          python tools/release_publication.py pypi-state \
            --wheel "dist/${WHEEL_FILENAME}" | tee /dev/stderr | grep -q "published_identical"

      - name: Require the release to still be a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::Release ${RELEASE_TAG} is no longer a draft; refusing to mutate a published release."
            exit 1
          fi

      - name: Attach signatures
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
        run: gh release upload "${RELEASE_TAG}" signatures/*.sigstore.json --clobber

      - name: Validate the exact remote asset set, byte for byte
        # Name membership was not enough. Draft repair clobbers expected names
        # but leaves unlisted ones behind, and an asset can be replaced during
        # the approval window, so the published bytes are re-derived here
        # rather than assumed from the staging run.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          WHEEL_FILENAME: ${{ needs.candidate.outputs.wheel_filename }}
          MANIFEST_SHA256: ${{ needs.candidate.outputs.manifest_sha256 }}
          CHANNEL: ${{ needs.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          rm -rf remote && mkdir -p remote
          gh release download "${RELEASE_TAG}" --dir remote --clobber
          # Closed-world: the remote set must be exactly the declared channel's
          # candidate assets plus the signature bundles that channel requires,
          # and every listed byte must match the digest the verification job
          # recorded.
          python tools/release_publication.py verify-manifest \
            --manifest remote/candidate-manifest.json \
            --expected-sha256 "${MANIFEST_SHA256}" \
            --expected-channel "${CHANNEL}" \
            --directory remote \
            --require-signatures
          echo "OK: the remote asset set matches the verified candidate exactly."

      - name: Verify the attached signatures
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          WHEEL_FILENAME: ${{ needs.candidate.outputs.wheel_filename }}
          SIGNED_ASSETS: ${{ needs.candidate.outputs.signed_assets }}
        run: |
          set -euo pipefail
          read -r -a signed_assets <<< "${SIGNED_ASSETS:?the candidate names no signed assets}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          for target in "${WHEEL_FILENAME}" "${signed_assets[@]}"; do
            sigstore verify identity \
              --bundle "remote/${target}.sigstore.json" \
              --cert-identity "${identity}" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              "remote/${target}"
          done
          echo "OK: attached signatures verify against ${identity}."

      - name: Re-derive the release notes from the verified commit
        # The remote *assets* are content-bound before undrafting; the release
        # *body* was not. Everything between staging and here — including the
        # protected-environment approval window — is time in which a
        # release-write actor or an integration can edit the draft's text, and
        # nothing downstream re-read it. The notes are therefore re-extracted
        # from CHANGELOG.md at the verified commit, bound to the digest
        # verification published, and reapplied in the same API call that
        # undrafts, so whatever the body says in the meantime cannot survive.
        env:
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          NOTES_SHA256: ${{ needs.candidate.outputs.release_notes_sha256 }}
        run: |
          python tools/release_notes.py \
            --changelog tools/CHANGELOG.md \
            --tag "${RELEASE_TAG}" \
            --expected-sha256 "${NOTES_SHA256}" \
            --output "${RUNNER_TEMP}/release-notes.md"

      - name: Finalise GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.candidate.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.candidate.outputs.source_sha }}
        run: |
          set -euo pipefail
          # Re-peeled once more: undrafting is the moment the release becomes
          # public, so the tag binding is confirmed as late as possible.
          peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}^{}" | cut -f1)"
          if [ -z "${peeled}" ]; then
            peeled="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | cut -f1)"
          fi
          if [ "${peeled}" != "${SOURCE_SHA}" ]; then
            echo "::error::Tag ${RELEASE_TAG} moved to ${peeled:-<missing>} before finalisation; refusing to publish the release."
            exit 1
          fi
          if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::Release ${RELEASE_TAG} is no longer a draft."
            exit 1
          fi
          if [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            maturity="--latest"
          else
            maturity="--prerelease"
          fi
          # Body and draft flag move together, in one PATCH: a compare-then-fix
          # would leave a window of its own, and reapplying afterwards would
          # publish the tampered text first.
          gh release edit "${RELEASE_TAG}" \
            --draft=false \
            "${maturity}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
