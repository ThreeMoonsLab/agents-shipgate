name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify tag matches package version
        # Fail fast before the test/build/publish pipeline if the tag
        # was cut on a commit whose pyproject.toml disagrees (e.g. a
        # v0.15.0 tag pushed while main still says 0.14.0). PyPI
        # uploads are immutable, so this is the last cheap moment to
        # catch a mistagged release.
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}; refusing to release."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} matches pyproject.toml (${version})."

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "uv==0.11.7"

      - name: Lint and test
        # v0.21 (E7): coverage threshold bumped from 75 → 85, matching
        # CI gate so release cannot bypass the tighter floor.
        run: |
          python -m ruff check .
          python -m compileall -q src tests
          python -m pytest --cov=agents_shipgate --cov-report=term-missing --cov-fail-under=85

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Dependency audit
        run: python -m pip_audit .

      - name: Generate SBOM
        run: cyclonedx-py environment --pyproject pyproject.toml -o dist/agents-shipgate-sbom.json

      - name: Sign release artifacts
        run: sigstore sign --output-directory dist --overwrite dist/*.whl dist/*.tar.gz dist/agents-shipgate-sbom.json

      - name: Publish to PyPI with Trusted Publishing
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Agents Shipgate ${GITHUB_REF_NAME}"
