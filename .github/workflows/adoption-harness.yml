name: Adoption Harness

# The live `run` job is workflow_dispatch only — no cron, because Claude Opus
# over the full matrix is recurring spend. Operators trigger it manually with
# an explicit budget cap. The `smoke` job (mock driver, zero API spend) also
# runs on a weekly cron so the harness pipeline stays verifiably green
# between paid runs. Smoke tests on PR CI run separately via the existing
# tests/harness/ pytest files, with no live API calls.
#
# Held to the same rules as every other workflow here, which
# tests/test_workflow_hardening.py checks (#1033): dispatch inputs reach a
# shell only through `env:`, actions are pinned by full commit SHA, a secret is
# scoped to the one step that needs it, every job has a timeout, and what is
# installed comes from hash-locked closures.

on:
  schedule:
    # Weekly mock-driver smoke only; the paid `run` job is gated to
    # workflow_dispatch below.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      matrix_file:
        description: "Path to matrix.yaml"
        required: false
        default: "benchmark/matrix.yaml"
      budget_usd:
        description: "Hard cap on cumulative cost_usd_estimate; aborts on overrun."
        required: false
        default: "20"
      agent_filter:
        description: "Comma-separated agent filter. Empty = all in matrix."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    # Paid live run — manual dispatch only, never on the cron schedule.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Scope HOME to a per-cell scratch dir so a wandering agent cannot reach a
      # real checkout via `cd $HOME/...` (defence in depth with the
      # stayed_in_workspace scorer blocker). On by default; pinned here for clarity.
      SHIPGATE_HARNESS_SCOPE_HOME: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          # Live agents run commands in this job; none of them needs the
          # workflow token in .git/config.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install harness dependencies
        # Hash-locked, as in CI: the development closure, the build backend,
        # then the harness's own closure, which is compiled against the first
        # two (see the header of constraints/harness.txt).
        run: |
          python -m pip install --require-hashes --requirement constraints/dev.txt
          python -m pip install --require-hashes --requirement constraints/build-backend.txt
          python -m pip install --require-hashes --requirement constraints/harness.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check
      - name: Materialize archetype fixtures
        run: python -m harness.adoption sync-fixtures
      - name: Run harness
        # The only step that holds the API key. The dispatch inputs reach the
        # shell as environment variables and are expanded inside quotes, so an
        # input is always one argument and never shell syntax.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MATRIX_FILE: ${{ inputs.matrix_file }}
          SHIPGATE_HARNESS_BUDGET_USD: ${{ inputs.budget_usd }}
          AGENT_FILTER: ${{ inputs.agent_filter }}
        run: |
          set -euo pipefail
          arguments=(--matrix="${MATRIX_FILE}" --budget-usd="${SHIPGATE_HARNESS_BUDGET_USD}")
          if [ -n "${AGENT_FILTER}" ]; then
            arguments+=(--agent="${AGENT_FILTER}")
          fi
          python -m harness.adoption run "${arguments[@]}"
      - name: Upload exit-criteria report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exit-criteria
          path: .agents-private/adoption-sprint/*/exit_criteria.json
          if-no-files-found: warn
      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: results-csv
          path: benchmark/results/*.csv
          if-no-files-found: warn

  smoke:
    # Always-on cheap path. Mock driver, no live API spend. Runs on
    # workflow_dispatch alongside the live run so operators can sanity-check
    # the pipeline. PR CI exercises the same code via tests/harness/.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install harness dependencies
        # The same closure the paid run installs, so a green smoke says the
        # paid run's environment installs too.
        run: |
          python -m pip install --require-hashes --requirement constraints/dev.txt
          python -m pip install --require-hashes --requirement constraints/build-backend.txt
          python -m pip install --require-hashes --requirement constraints/harness.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check
      - name: Smoke
        run: python -m harness.adoption smoke
