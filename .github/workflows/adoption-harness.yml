name: Adoption Harness

# The live `run` job is workflow_dispatch only — no cron, because Claude Opus
# over the full matrix is recurring spend. Operators trigger it manually with
# an explicit budget cap. The `smoke` job (mock driver, zero API spend) also
# runs on a weekly cron so the harness pipeline stays verifiably green
# between paid runs. Smoke tests on PR CI run separately via the existing
# tests/harness/ pytest files, with no live API calls.

on:
  schedule:
    # Weekly mock-driver smoke only; the paid `run` job is gated to
    # workflow_dispatch below.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      matrix_file:
        description: "Path to matrix.yaml"
        required: false
        default: "benchmark/matrix.yaml"
      budget_usd:
        description: "Hard cap on cumulative cost_usd_estimate; aborts on overrun."
        required: false
        default: "20"
      agent_filter:
        description: "Comma-separated agent filter. Empty = all in matrix."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    # Paid live run — manual dispatch only, never on the cron schedule.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SHIPGATE_HARNESS_BUDGET_USD: ${{ inputs.budget_usd }}
      # Scope HOME to a per-cell scratch dir so a wandering agent cannot reach a
      # real checkout via `cd $HOME/...` (defence in depth with the
      # stayed_in_workspace scorer blocker). On by default; pinned here for clarity.
      SHIPGATE_HARNESS_SCOPE_HOME: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install harness dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r harness/requirements.txt
          pip install -e .
      - name: Materialize archetype fixtures
        run: python -m harness.adoption sync-fixtures
      - name: Run harness
        run: |
          python -m harness.adoption run \
            --matrix=${{ inputs.matrix_file }} \
            --budget-usd=${{ inputs.budget_usd }} \
            ${{ inputs.agent_filter && format('--agent={0}', inputs.agent_filter) || '' }}
      - name: Upload exit-criteria report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exit-criteria
          path: .agents-private/adoption-sprint/*/exit_criteria.json
          if-no-files-found: warn
      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-csv
          path: benchmark/results/*.csv
          if-no-files-found: warn

  smoke:
    # Always-on cheap path. Mock driver, no live API spend. Runs on
    # workflow_dispatch alongside the live run so operators can sanity-check
    # the pipeline. PR CI exercises the same code via tests/harness/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install harness dependencies
        run: |
          pip install -r harness/requirements.txt
          pip install -e .
      - name: Smoke
        run: python -m harness.adoption smoke
