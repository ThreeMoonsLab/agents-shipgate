name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  suite:
    # The aggregate test run, split across parallel jobs.
    #
    # It used to be one step inside `test`, and that job spent 456-839s of its
    # 15-minute budget on it depending on runner speed — so whether a green
    # commit stayed green was decided by which runner it drew, and `main`
    # itself was cancelled at the cap. Splitting the *suite* rather than
    # raising the number keeps a real bound: each shard is roughly a third of
    # the work, so the margin grows back and stays there as the suite grows
    # (add a shard).
    #
    # `conftest.py` assigns whole test *files* to shards, deterministically,
    # from the collection alone — nothing is exchanged between these jobs.
    # `tests/test_shard_partition.py` asserts the union of the shards is the
    # suite, because a partition that silently drops a file leaves every job
    # green while a test stops running.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Tags, because `tests/test_adopter_pins_resolve.py` checks the pins
          # `init` writes into an adopter's repository against this
          # repository's release tags — the check whose absence let a workflow
          # pinned to a tag that was never cut ship for 56 days (#506). The
          # default shallow fetch brings none, and that test fails loudly
          # rather than passing over an empty tag list.
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints/dev.txt
            constraints/build-backend.txt

      - name: Install
        # The same hash-locked closure the `test` job installs; the rationale
        # for each flag is on that job. `pip check` runs there rather than
        # three more times here.
        run: |
          python -m pip install --require-hashes --requirement constraints/dev.txt
          python -m pip install --require-hashes --requirement constraints/build-backend.txt
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Verify the dependency locks match the declared requirements
        # Repeated from the `test` job on purpose. It exists to fail by name
        # *before* the suite, rather than surfacing as a confusing ImportError
        # partway through it — and now that the suite runs in its own job, a
        # copy in `test` alone would merely race it.
        run: python scripts/verify_dependency_lock.py

      - name: Test (shard ${{ matrix.shard }} of 3)
        # Excludes the `perf` marker — the latency budget tests run in the
        # `test` job, alone, so their timing isn't disturbed by parallel load.
        #
        # The static adapter invariant lint runs as its own fail-fast step
        # there too, so keep it out of the coverage pass rather than doing the
        # same AST sweep twice on every PR.
        #
        # No `--cov-fail-under` here: a shard covers a third of the suite, so
        # its coverage is a fragment. The threshold is enforced once, on the
        # combined data, in `coverage` below.
        env:
          SHIPGATE_TEST_SHARDS: 3
          SHIPGATE_TEST_SHARD: ${{ matrix.shard }}
        run: python -m pytest -n auto -m "not perf" --ignore=tests/test_adapter_static_only.py --cov=agents_shipgate --cov-report=

      - name: Upload coverage fragment
        # Renamed off the leading dot on purpose: `.coverage` is a hidden file
        # and whether the uploader picks one up depends on the action version
        # this workflow pins. A fragment that silently fails to upload would
        # leave the gate measuring two thirds of the suite and passing.
        run: mv .coverage coverage-fragment.dat

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-fragment.dat
          if-no-files-found: error

  coverage:
    # The coverage gate, enforced once over the combined fragments.
    #
    # Splitting the suite split its coverage with it, and three partial
    # measurements each fail an 85% threshold that the whole run passes. This
    # job is where the number is a number about the suite again.
    needs: [suite]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/dev.txt

      - name: Install
        # Only `coverage` itself. This job never imports the package: it reads
        # the data files and reports against the source paths recorded in them,
        # which are this checkout's. Installing the project editable here would
        # also have failed — `--no-build-isolation` needs the backend closure
        # from `constraints/build-backend.txt`, which this job has no other
        # reason to want.
        run: python -m pip install --require-hashes --requirement constraints/dev.txt

      - name: Download coverage fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          path: coverage-fragments

      - name: Combine and enforce the threshold
        # v0.21 (E7): bumped from 75 → 85. Actual aggregate coverage on
        # current main is ~88%, so the gate is +10pp tighter with ~3pp
        # headroom for day-to-day movement. The bump catches the next time a
        # refactor lands materially less-covered code without a corresponding
        # test pass.
        #
        # `coverage combine` consumes its inputs, so the fragments are copied
        # to distinct names first — three files all called `.coverage` in
        # separate directories would otherwise collide on the way in.
        run: |
          set -euo pipefail
          shopt -s nullglob
          fragments=(coverage-fragments/coverage-*/coverage-fragment.dat)
          if [ "${#fragments[@]}" -eq 0 ]; then
            echo "no coverage fragments were downloaded; the shards produced none." >&2
            exit 1
          fi
          index=0
          for fragment in "${fragments[@]}"; do
            index=$((index + 1))
            cp "${fragment}" ".coverage.${index}"
          done
          echo "combining ${index} coverage fragment(s)"
          python -m coverage combine
          python -m coverage report --show-missing --fail-under=85

  test:
    # Everything that is not the aggregate suite: the fail-fast lints, the
    # named safety canaries, the latency budget, and the release-shaped
    # packaging checks.
    #
    # Deliberately independent of `suite`. Several of these steps exist to
    # fail *before* the long run, by name — a `needs` here would make them
    # report after it instead, which is the opposite of what they are for.
    # Every job is its own required check, so "CI passed" is still all of
    # them passing.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Tags, so the cadence step below can see the newest release. The
          # default shallow fetch brings none, and a cadence metric that
          # silently reports `unknown` is the same defect as not having one.
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints/dev.txt
            constraints/build-backend.txt

      - name: Release cadence
        # #491: 81% of the changelog had never shipped because nothing counted
        # the gap. This is the surface that counts it -- every pull request and
        # every push to `main` prints the number into the job summary, and
        # annotates a warning once the interval lapses. The policy the number
        # is measured against is in `docs/release-runbook.md` (# Cadence).
        #
        # Deliberately not a failing check. Going red here would fail whichever
        # unrelated change happened to arrive after the interval lapsed, and
        # that author is not the actor who can fix it. `--fail-when-overdue`
        # exists for an operator and is not passed here. It runs before the
        # install so the number is recorded even when a later step fails.
        run: python scripts/release_cadence.py --github

      - name: Install
        # The hash-locked closure, not a fresh resolve of `.[dev]`. Release
        # verification installs these same files with these same commands, so
        # "CI was green" is a statement about the packages the release will
        # actually use.
        #
        # The project is installed separately with `--no-deps` because an
        # editable install cannot be hashed; `pip check` then proves the locked
        # closure really satisfies its declared dependencies.
        #
        # `--no-build-isolation` is load-bearing, not tidiness. `--no-deps`
        # does not disable PEP 517 build isolation, and `PIP_CONSTRAINT` does
        # not reach an isolated build environment on current pip — constraining
        # hatchling to a version that does not exist still built successfully —
        # so this step used to resolve its backend and the backend's own
        # dependencies from the index on every run. The backend closure is
        # installed above instead, hashed, and no build environment is created.
        run: |
          python -m pip install --require-hashes --requirement constraints/dev.txt
          python -m pip install --require-hashes --requirement constraints/build-backend.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check

      - name: Verify the dependency locks match the declared requirements
        # Fails fast and by name when pyproject.toml and a lock disagree, rather
        # than letting a stale lock surface as a confusing ImportError or as a
        # release that installed something CI never tested.
        run: python scripts/verify_dependency_lock.py

      - name: Lint
        run: python -m ruff check .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Verify generated schemas are up to date
        run: python scripts/generate_schemas.py --check

      - name: Trust-model invariant lint (static, no user code execution)
        run: python -m pytest tests/test_adapter_static_only.py -q
        # Fails fast and visibly before the full suite when an adapter
        # under src/agents_shipgate/inputs/ introduces exec/eval/__import__/
        # compile or a dynamic-import surface (importlib/runpy/subprocess).
        # The companion live-load tests in tests/test_fixture_no_import.py
        # run as part of the main Test step below.

      - name: Evidence-backed pass safety canaries (64/64 exact outcomes)
        run: python -m pytest tests/test_p0_safety_canaries.py -q
        # This is deliberately separate from the aggregate test run. A P0
        # verdict regression should fail with a named canary before coverage,
        # integration, or performance noise can obscure the safety signal.

      - name: Agent binding safety canaries
        run: python -m pytest tests/test_p0_binding_canaries.py -q
        # Binding is a separate trust dimension from effect and authority.
        # Keep these exact outcomes visible before the aggregate coverage run.

      - name: Multi-host boundary safety canaries (48+ exact outcomes)
        run: python -m pytest tests/test_agent_boundary.py -q
        # Cross-host boundary completeness is a separate trust dimension.
        # Keep false-complete, input-integrity, and secret-redaction failures
        # visible before the aggregate coverage run.

      - name: Latency budget
        # Runs the `benchmark/perf/scenarios/` synthetic scans and
        # asserts median wallclock stays under the per-scenario budget
        # in `benchmark/perf/budgets.yaml`. Budgets are deliberately
        # generous (~10-20x measured local time) so this catches
        # catastrophic regressions, not noise. On failure the test
        # output shows a per-phase breakdown via `_perf` — start there
        # before profiling. See `benchmark/perf/README.md` for tuning.
        run: python -m pytest tests/test_latency_budget.py -m perf -v

      - name: Build package
        # `--no-isolation` for the same reason the release build uses it: with
        # isolation, `build` creates a fresh environment and re-resolves
        # `hatchling>=1.31.0` from the index — twice, once per distribution —
        # so the artifact CI checks was produced by a backend nothing pinned,
        # even though the hashed closure is already installed in this job.
        run: |
          python -m build --no-isolation
          python -m twine check dist/*

      - name: A released install reports itself as one
        # The environment every adopter actually has, and the one this job
        # otherwise never sees: it installs the project editable before it runs
        # anything, so `import_source.kind` is `source_checkout` for the whole
        # run above. Checked from outside the checkout because that is where an
        # adopter stands — inside it, a wheel answering for a source tree is a
        # *correct* `import_outside_source_tree` error rather than a passing
        # case, and asserting "no errors" there would be asserting the wrong
        # thing (#334).
        #
        # `PATH` is scoped to the released install for the run itself, and that
        # is part of what is under test rather than housekeeping. This job also
        # has an *editable* install whose console scripts sit on the runner's
        # `PATH`, so with them visible a bare `agents-shipgate` really would
        # execute a different installation than the wheel being checked — a
        # correct `console_script_runs_other_interpreter`, and not the adopter
        # environment this step is about. Scoping it puts the wheel's own
        # scripts first, which is what an adopter has, and lets the assertions
        # below stay exact.
        run: |
          python -m venv /tmp/released-install
          /tmp/released-install/bin/python -m pip install --quiet dist/*.whl
          cp -r samples/support_refund_agent /tmp/adopter
          cd /tmp
          PATH=/tmp/released-install/bin:/usr/bin:/bin \
            /tmp/released-install/bin/agents-shipgate doctor \
            --config /tmp/adopter/shipgate.yaml --json > /tmp/released.json
          python - <<'PY'
          import json, pathlib
          environment = json.loads(pathlib.Path("/tmp/released.json").read_text())[0]["environment"]
          assert environment["import_source"]["kind"] == "installed", environment["import_source"]
          assert environment["installed_version"] == environment["imported_version"], environment
          assert environment["source_tree"]["root"] is None, environment["source_tree"]
          # The healthy adopter shape, stated rather than implied by silence:
          # the wrappers on PATH are found, and they run this interpreter.
          scripts = environment["launcher"]["console_scripts"]
          assert [entry["name"] for entry in scripts] == ["agents-shipgate", "shipgate"], scripts
          assert all(entry["runs_this_interpreter"] for entry in scripts), scripts
          assert environment["mismatches"] == [], environment["mismatches"]
          PY

      - name: Dependency audit
        run: python -m pip_audit .

      - name: Generate SBOM
        run: cyclonedx-py environment --pyproject pyproject.toml -o sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.json

  clean-checkout-launcher:
    # `./shipgate` has to work on a checkout where Agents Shipgate itself is
    # not installed: no console script on `PATH`, no editable install, no
    # `PYTHONPATH`. That is precisely the environment the `test` job can never
    # have, because it installs the project before it runs anything — so the
    # claim in CONTRIBUTING.md and AGENTS.md is verified here or nowhere.
    #
    # Only the dependency closure is installed. A clean checkout still needs
    # its dependencies from somewhere; what it must not need is a copy of
    # Agents Shipgate, or a `PYTHONPATH` the contributor had to be told about.
    #
    # The remaining cases from #334 — stale console script, unsupported
    # interpreter, missing dependencies, editable install — are in
    # `tests/test_environment.py` and run in the `test` job above: each is
    # reachable from stated facts or from one subprocess, and none of them
    # needs a job of its own.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/dev.txt

      - name: Install the dependency closure, and nothing else
        run: python -m pip install --require-hashes --requirement constraints/dev.txt

      - name: The canonical contributor command runs
        run: |
          ./shipgate --version
          ./shipgate doctor --config samples/support_refund_agent/shipgate.yaml --json > doctor.json
          python - <<'PY'
          import json, pathlib
          payload = json.loads(pathlib.Path("doctor.json").read_text())[0]
          environment = payload["environment"]
          checkout = pathlib.Path.cwd()
          launcher = str(checkout / "shipgate")
          # Nothing installed, and this tree is what answered.
          assert environment["installed_version"] is None, environment["installed_version"]
          assert environment["import_source"]["root"] == str(checkout / "src"), environment
          assert environment["source_tree"]["root"] == str(checkout), environment
          assert environment["launcher"]["executable"] == [launcher], environment["launcher"]
          assert environment["mismatches"] == [], environment["mismatches"]
          # And every command it hands back is runnable as printed: a bare
          # `agents-shipgate` does not exist in this job.
          assert payload["next_action"].startswith(launcher), payload["next_action"]
          assert payload["next_actions"][0]["executable"] == [launcher], payload["next_actions"][0]
          PY

  windows-launcher:
    # The canonical contributor command, on the one platform where "run the
    # file" is not a thing the OS does. A shebang is a POSIX kernel feature, so
    # `.\shipgate` is inert on Windows and the documented spelling is
    # `python shipgate ...` — which means the launcher has to *announce* that
    # spelling too, or every recovery command it prints is unrunnable there.
    #
    # This job also covers the `os.name == "nt"` re-execution branch, which no
    # amount of unit testing on Linux can reach: `os.execv` on Windows spawns
    # and exits the parent, so that branch forwards a child's status instead,
    # and whether it really forwards is a claim about a Windows process.
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints/dev.txt

      - name: Install the dependency closure, and nothing else
        # The same hash-locked closure the other jobs install. It resolves here
        # because the lock is universal — it carries the Windows wheels and the
        # `os_name == 'nt'` markers — so this is the environment CI approves
        # everywhere, not a Windows-only resolve.
        run: python -m pip install --require-hashes --requirement constraints/dev.txt

      - name: The documented Windows spelling runs, and is what gets announced
        run: |
          python shipgate --version
          python shipgate doctor --config samples/support_refund_agent/shipgate.yaml --json > doctor.json
          python - <<'PY'
          import json, pathlib, sys
          payload = json.loads(pathlib.Path("doctor.json").read_text())[0]
          environment = payload["environment"]
          launcher = str(pathlib.Path.cwd() / "shipgate")
          # Two tokens, because Windows will not start the file on its own.
          assert environment["launcher"]["executable"] == [sys.executable, launcher], (
              environment["launcher"]
          )
          assert environment["import_source"]["root"] == str(pathlib.Path.cwd() / "src")
          assert environment["mismatches"] == [], environment["mismatches"]
          # And the emitted recovery is spelled the same way it is documented.
          assert payload["next_actions"][0]["executable"] == [sys.executable, launcher]
          PY

      - name: Re-executing into another interpreter forwards its status
        # `--system-site-packages` so the selected interpreter can still import
        # the closure: what is under test is the switch and the status
        # forwarding, not a second installation.
        run: |
          python -m venv --system-site-packages .winvenv
          export AGENTS_SHIPGATE_PYTHON="$(cygpath -w "$PWD/.winvenv/Scripts/python.exe")"
          python shipgate doctor --config samples/support_refund_agent/shipgate.yaml --json > reexec.json
          python - <<'PY'
          import json, os, pathlib
          environment = json.loads(pathlib.Path("reexec.json").read_text())[0]["environment"]
          selected = os.environ["AGENTS_SHIPGATE_PYTHON"]
          assert environment["interpreter"]["executable"] == selected, environment["interpreter"]
          PY
          # A non-zero status has to survive the hop as well: `doctor` exits 2
          # when the manifest cannot be found, and a branch that spawns instead
          # of replacing the process is exactly where that gets lost.
          set +e
          python shipgate doctor --config no-such-manifest.yaml --json
          status=$?
          set -e
          [ "$status" = "2" ] || { echo "::error::expected exit 2 through the re-exec, got $status"; exit 1; }

  release-tag-consistency:
    # Public install surfaces follow
    # `.well-known.release_status.latest_release`, while pyproject may be
    # ahead on a source-tree pre-release. Public-surface tests enforce that
    # split. What no local test could catch: the install surfaces moving
    # to a version that was never actually released. That happened with
    # v0.14.0 (pyproject and the README `@v0.14.0` Action pin landed on
    # main a day before the tag existed, so the copy-paste workflow
    # 404'd). This job checks the claim against release reality: the
    # tag must exist on origin.
    #
    # Runs on pushes to main only (the `push` trigger above is scoped
    # to main), never on pull_request — so a version-bump PR is never
    # blocked, but a merged bump without a pushed tag turns main red
    # until the tag is pushed or the claim is reverted.
    #
    # Recovery: pushing the tag triggers release.yml, not this run, so
    # a failed run does not clear itself on tag push. It re-checks
    # origin's live tag list on re-run — after pushing the tag, use
    # "Re-run failed jobs" on this run (or wait for the next push to
    # main). A tag trigger on this workflow would not help: it would
    # start a *new* run on the tag ref, leave the failed branch run
    # red on the CI badge, and re-run the full test job that
    # release.yml already runs on the tag.
    #
    # Deliberately tag-only: the tag is what triggers release.yml, the
    # canonical publisher, which itself fails loudly if the PyPI upload
    # or GitHub Release step breaks — so "tag exists + release.yml
    # green" covers /releases/latest and PyPI. Querying PyPI here would
    # add an external dependency that lags publish by minutes (the
    # /json index is CDN-cached) and can false-fail right after a
    # legitimate release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify the claimed latest release tag exists on origin
        run: |
          latest_release="$(python3 -c 'import json; print(json.load(open(".well-known/agents-shipgate.json"))["release_status"]["latest_release"])')"
          if [ -z "${latest_release}" ]; then
            echo "::error::Could not read release_status.latest_release from .well-known/agents-shipgate.json."
            exit 1
          fi
          echo "Claimed latest published release: ${latest_release}"
          if git ls-remote --exit-code --tags origin "refs/tags/${latest_release}" > /dev/null; then
            echo "OK: tag ${latest_release} exists on origin."
          else
            echo "::error::Public install surfaces claim ${latest_release} as the latest release, but that tag does not exist on origin."
            echo "Cut the release or restore release_status.latest_release to the latest published tag."
            echo "then use 'Re-run failed jobs' on this run — pushing the tag triggers release.yml, not a retest of this run, but a re-run re-checks origin's live tag list. The check also clears on the next push to main."
            exit 1
          fi
