version: 2

# The constraints/ locks are hash-pinned closures, not flat requirement lists:
# most lines are transitive and are recorded with a `# via <parent>` comment.
# Dependabot treats every line as independently bumpable, so it will raise a pin
# past the cap of the parent that pulls it in. Such a PR can never go green —
# pip fails with ResolutionImpossible at install time, before any test runs —
# and it cannot be repaired by rebasing, only closed.
#
# A transitive pin should move because its parent moved. When one of these is
# genuinely wanted, bump the parent and recompile with scripts/update_locks.py.

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # `# via cyclonedx-bom`, which requires chardet!=6.*,<8,>=5.1 since 7.5.0
      # (7.3.1 capped it at <6.0, which is why #407 was closed). chardet 7.x is
      # admitted and locked; 6.* is excluded and 8 is beyond the cap, so a
      # semver-major bump here can only ever be unsatisfiable. Major updates
      # only: movement within 7.x is still legitimate, and this is worth
      # revisiting if cyclonedx-bom ever lifts the <8 cap.
      - dependency-name: "chardet"
        update-types: ["version-update:semver-major"]
      # `# via pydantic`, which pins it *exactly* rather than as a range:
      # pydantic 2.13.4 requires pydantic-core==2.46.4, and 2.13.5 requires
      # ==2.46.5. Any independent bump is unsatisfiable at every update type,
      # so this one is ignored outright. Closed #382 on this.
      - dependency-name: "pydantic-core"
    # One pull request per weekly cycle for minor and patch bumps instead of
    # one per package (#501). Dependabot edits the hash locks as plain
    # requirement files, so a grouped PR is a request, never merged as-is: the
    # maintainer recompiles the affected locks (CONTRIBUTING.md § Changing
    # dependencies). `applies-to: version-updates` keeps security updates out
    # of the group, so an advisory still arrives as its own pull request.
    # Major bumps stay individual. The lock resolver (uv) and the coding-agent
    # harness SDK (harness/requirements.txt) are excluded: a uv bump changes
    # how every lock is compiled, and the harness floor waits on a paid run.
    groups:
      python-dependencies:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
        exclude-patterns: ["uv", "claude-agent-sdk"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
