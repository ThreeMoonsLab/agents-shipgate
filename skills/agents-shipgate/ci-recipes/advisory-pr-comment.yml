# Advisory PR comment.
# Recommended starting point — runs the scanner on every PR, posts a summary
# comment, uploads the report as an artifact, and never fails the job.
#
# Both pins below name one engine: the final release build that rendered this
# file, or the latest *published* release when a development or preview build
# rendered it. This recipe runs in someone else's CI: GitHub resolves `uses:`
# before any step executes, and `shipgate_version` installs from PyPI, so a pin
# to an unreleased build fails the adopter's first run with an error about our
# repository. See docs/distribution-surfaces.md § Release channels.
name: Agents Shipgate (advisory)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  shipgate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ThreeMoonsLab/agents-shipgate@v1.0.0
        with:
          ci_mode: advisory
          diff_base: target
          pr_comment: 'true'
          shipgate_version: '1.0.0'
