name: Agents Shipgate
description: >-
  Local-first, static Tool-Use Readiness release gate for AI agent tool
  surfaces. Scans MCP, OpenAPI, OpenAI Agents SDK, Anthropic, Google ADK,
  LangChain, CrewAI, OpenAI API, Codex plugin, and n8n artifacts.
  Writes a Tool-Use Readiness Report (Markdown / JSON / SARIF) before your
  agent gets production-like permissions. Static-by-default. Audited
  exceptions are pinned per call site in
  tests/test_adapter_static_only.py::ALLOWED_EXCEPTIONS. Apache-2.0.
author: ThreeMoonsLab

branding:
  icon: shield
  color: blue

inputs:
  config:
    required: false
    default: shipgate.yaml
    description: Path to shipgate.yaml.
  ci_mode:
    required: false
    default: advisory
    description: advisory or strict.
  fail_on:
    required: false
    default: ""
    description: Optional comma-separated severities that fail CI, for example critical,high.
  baseline:
    required: false
    default: ""
    description: Optional local baseline JSON path. Strict mode fails only on new findings.
  diff_from:
    required: false
    default: ""
    description: Optional prior report.json or v0.4 baseline JSON for tool/action surface diff.
  diff_base:
    required: false
    default: ""
    description: Set to target to use the locally available pull request base branch for diff.
  base_ref:
    required: false
    default: ""
    description: Optional local base ref/SHA for PR diff. Falls back to origin/<github.base_ref>. The action never fetches.
  head_ref:
    required: false
    default: ""
    description: Optional local head ref/SHA for PR diff and scan. Omit to scan the checked-out workspace.
  baseline_mode:
    required: false
    default: new-findings
    description: "Baseline comparison mode. Supported value: new-findings."
  policy_packs:
    required: false
    default: ""
    description: Optional comma- or newline-separated declarative YAML policy pack paths.
  no_plugins:
    required: false
    default: "false"
    description: Force third-party check plugins off even when AGENTS_SHIPGATE_ENABLE_PLUGINS is set.
  output_dir:
    required: false
    default: agents-shipgate-reports
    description: Output directory for reports.
  upload_artifact:
    required: false
    default: "true"
    description: Upload reports as a workflow artifact.
  pr_comment:
    required: false
    default: "false"
    description: Post a short PR comment when running on pull_request.
  github_token:
    required: false
    default: ""
    description: Token for optional PR comments.
  shipgate_version:
    required: false
    default: ""
    description: Optional Agents Shipgate PyPI version to install. Empty installs this action source.

outputs:
  # Legacy v0.7-caller output; baseline-blind. Prefer release_decision.decision
  # via the `decision` output below for gating.
  status:
    description: Agents Shipgate summary status (legacy v0.7 caller; baseline-blind).
    value: ${{ steps.report_outputs.outputs.status }}
  critical_count:
    description: Number of unsuppressed critical findings.
    value: ${{ steps.report_outputs.outputs.critical_count }}
  high_count:
    description: Number of unsuppressed high findings.
    value: ${{ steps.report_outputs.outputs.high_count }}
  medium_count:
    description: Number of unsuppressed medium findings.
    value: ${{ steps.report_outputs.outputs.medium_count }}
  baseline_new_count:
    description: Number of new findings when a baseline is used.
    value: ${{ steps.report_outputs.outputs.baseline_new_count }}
  baseline_matched_count:
    description: Number of baseline-matched findings when a baseline is used.
    value: ${{ steps.report_outputs.outputs.baseline_matched_count }}
  baseline_resolved_count:
    description: Number of baseline findings resolved by the current scan.
    value: ${{ steps.report_outputs.outputs.baseline_resolved_count }}
  adk_agent_count:
    description: Number of Google ADK agents statically detected.
    value: ${{ steps.report_outputs.outputs.adk_agent_count }}
  adk_dynamic_toolset_count:
    description: Number of Google ADK toolsets that were dynamic or unresolved.
    value: ${{ steps.report_outputs.outputs.adk_dynamic_toolset_count }}
  report_json:
    description: Path to the generated JSON report.
    value: ${{ steps.report_outputs.outputs.report_json }}
  report_markdown:
    description: Path to the generated Markdown report.
    value: ${{ steps.report_outputs.outputs.report_markdown }}
  report_sarif:
    description: Path to the generated SARIF report.
    value: ${{ steps.report_outputs.outputs.report_sarif }}
  verifier_json:
    description: Path to verifier.json.
    value: ${{ steps.report_outputs.outputs.verifier_json }}
  pr_comment_markdown:
    description: Path to the generated PR comment Markdown.
    value: ${{ steps.report_outputs.outputs.pr_comment_markdown }}
  exit_code:
    description: Agents Shipgate CLI exit code.
    value: ${{ steps.scan.outputs.exit_code }}
  decision:
    description: Release decision (`blocked`, `review_required`, `insufficient_evidence`, or `passed`). v0.8+; `insufficient_evidence` added v0.14.
    value: ${{ steps.report_outputs.outputs.decision }}
  blocker_count:
    description: Number of blockers in release_decision (v0.8+).
    value: ${{ steps.report_outputs.outputs.blocker_count }}
  review_item_count:
    description: Number of review items in release_decision (v0.8+).
    value: ${{ steps.report_outputs.outputs.review_item_count }}
  ci_would_fail:
    description: Whether the active fail policy would fail CI (`true`/`false`). v0.8+.
    value: ${{ steps.report_outputs.outputs.ci_would_fail }}
  diff_enabled:
    description: Whether tool_surface_diff was enabled in report.json.
    value: ${{ steps.report_outputs.outputs.diff_enabled }}
  action_diff_enabled:
    description: Whether action_surface_diff was enabled in report.json.
    value: ${{ steps.report_outputs.outputs.action_diff_enabled }}
  actions_added:
    description: Number of actions added by Action Surface Diff.
    value: ${{ steps.report_outputs.outputs.actions_added }}
  actions_modified:
    description: Number of actions modified by Action Surface Diff.
    value: ${{ steps.report_outputs.outputs.actions_modified }}
  actions_removed:
    description: Number of actions removed by Action Surface Diff.
    value: ${{ steps.report_outputs.outputs.actions_removed }}
  should_run:
    description: Whether the trigger catalog said Shipgate should run on this diff (`true`/`false`). v0.22+.
    value: ${{ steps.report_outputs.outputs.should_run }}
  trigger_rule_ids:
    description: Comma-separated IDs of the trigger rules that matched. v0.22+.
    value: ${{ steps.report_outputs.outputs.trigger_rule_ids }}
  merge_verdict:
    description: "Merge verdict projected from release_decision (`mergeable`, `human_review_required`, `insufficient_evidence`, `blocked`, or `unknown`). v0.22+."
    value: ${{ steps.report_outputs.outputs.merge_verdict }}
  can_merge_without_human:
    description: Whether the PR can merge without human review (`true`/`false`). v0.22+.
    value: ${{ steps.report_outputs.outputs.can_merge_without_human }}
  trust_root_touched:
    description: Whether the PR changed a release-gate trust root (SHIP-VERIFY-TRUST-ROOT-TOUCHED fired). v0.22+.
    value: ${{ steps.report_outputs.outputs.trust_root_touched }}
  policy_weakened:
    description: Whether semantic policy weakening was detected. Reserved; currently always `false`. v0.22+.
    value: ${{ steps.report_outputs.outputs.policy_weakened }}
  capability_changes_added:
    description: Number of added agent capabilities (actions/tools/scopes) in the PR diff. v0.22+.
    value: ${{ steps.report_outputs.outputs.capability_changes_added }}
  capability_changes_modified:
    description: Number of modified agent capabilities in the PR diff. v0.22+.
    value: ${{ steps.report_outputs.outputs.capability_changes_modified }}
  capability_changes_removed:
    description: Number of removed agent capabilities in the PR diff. v0.22+.
    value: ${{ steps.report_outputs.outputs.capability_changes_removed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
      with:
        python-version: "3.12"

    - name: Install Agents Shipgate
      shell: bash
      env:
        SHIPGATE_VERSION: ${{ inputs.shipgate_version }}
      run: |
        if [ -n "${SHIPGATE_VERSION}" ]; then
          python -m pip install "agents-shipgate==${SHIPGATE_VERSION}"
        else
          python -m pip install "${GITHUB_ACTION_PATH}"
        fi

    - name: Run Agents Shipgate
      id: scan
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        CI_MODE: ${{ inputs.ci_mode }}
        FAIL_ON: ${{ inputs.fail_on }}
        BASELINE: ${{ inputs.baseline }}
        BASELINE_MODE: ${{ inputs.baseline_mode }}
        DIFF_FROM: ${{ inputs.diff_from }}
        DIFF_BASE: ${{ inputs.diff_base }}
        INPUT_BASE_REF: ${{ inputs.base_ref }}
        INPUT_HEAD_REF: ${{ inputs.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        EVENT_NAME: ${{ github.event_name }}
        POLICY_PACKS: ${{ inputs.policy_packs }}
        NO_PLUGINS: ${{ inputs.no_plugins }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        args=(
          verify
          --workspace "."
          --config "${CONFIG}"
          --ci-mode "${CI_MODE}"
          --out "${OUTPUT_DIR}"
          --format json
        )
        if [ -n "${FAIL_ON}" ]; then
          args+=(--fail-on "${FAIL_ON}")
        fi
        if [ -n "${BASELINE}" ]; then
          args+=(--baseline "${BASELINE}" --baseline-mode "${BASELINE_MODE}")
        fi
        if [ -n "${DIFF_FROM}" ]; then
          args+=(--diff-from "${DIFF_FROM}")
        fi
        resolved_base_ref="${INPUT_BASE_REF}"
        if [ -z "${resolved_base_ref}" ] && [ "${DIFF_BASE}" = "target" ] && [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_REF}" ]; then
          resolved_base_ref="origin/${BASE_REF}"
        fi
        if [ -n "${resolved_base_ref}" ]; then
          args+=(--base "${resolved_base_ref}")
        fi
        if [ -n "${INPUT_HEAD_REF}" ]; then
          args+=(--head "${INPUT_HEAD_REF}")
        fi
        if [ -n "${POLICY_PACKS}" ]; then
          while IFS= read -r policy_pack; do
            [ -z "${policy_pack}" ] && continue
            args+=(--policy-pack "${policy_pack}")
          done < <(printf '%s\n' "${POLICY_PACKS}" | tr ',' '\n')
        fi
        if [ "${NO_PLUGINS}" = "true" ]; then
          args+=(--no-plugins)
        fi
        set +e
        agents-shipgate "${args[@]}"
        exit_code=$?
        echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
        exit 0

    - name: Extract Agents Shipgate outputs
      id: report_outputs
      if: ${{ always() }}
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        python - <<'PY'
        import json
        import os
        from pathlib import Path

        output_dir = Path(os.environ.get("OUTPUT_DIR") or "agents-shipgate-reports")
        report_json = output_dir / "report.json"
        report_markdown = output_dir / "report.md"
        report_sarif = output_dir / "report.sarif"
        verifier_json = output_dir / "verifier.json"
        pr_comment_markdown = output_dir / "pr-comment.md"
        summary = {}
        baseline = {}
        adk_surface = {}
        release_decision = {}
        fail_policy = {}
        tool_surface_diff = {}
        diff_summary = {}
        action_surface_diff = {}
        action_diff_summary = {}
        if report_json.exists():
            with report_json.open(encoding="utf-8") as handle:
                payload = json.load(handle)
                summary = payload.get("summary") or {}
                baseline = payload.get("baseline") or {}
                adk_surface = (payload.get("frameworks") or {}).get("google_adk") or {}
                release_decision = payload.get("release_decision") or {}
                fail_policy = release_decision.get("fail_policy") or {}
                tool_surface_diff = payload.get("tool_surface_diff") or {}
                diff_summary = tool_surface_diff.get("summary") or {}
                action_surface_diff = payload.get("action_surface_diff") or {}
                action_diff_summary = action_surface_diff.get("summary") or {}

        # verifier.json carries the merge-decision projection + trigger result.
        # It is always written by `verify` (even on a trigger-skip), so these
        # outputs are populated whether or not a head scan ran.
        verifier = {}
        if verifier_json.exists():
            with verifier_json.open(encoding="utf-8") as handle:
                verifier = json.load(handle)
        trigger = verifier.get("trigger") or {}
        capability_changes = verifier.get("capability_changes") or []
        trigger_rule_ids = ",".join(
            m.get("id", "")
            for m in (trigger.get("matched_rules") or [])
            if m.get("id")
        )

        def _count_caps(kinds: set) -> int:
            return sum(
                1 for c in capability_changes if c.get("change_type") in kinds
            )

        cap_added = _count_caps({"action_added", "tool_added", "scope_added"})
        cap_removed = _count_caps({"action_removed", "tool_removed", "scope_removed"})
        cap_modified = len(capability_changes) - cap_added - cap_removed

        def clean(value: object) -> str:
            # `value or ""` would emit 0 as "", which breaks workflow
            # checks like `if: outputs.blocker_count == '0'`. Treat None
            # as empty; stringify everything else (including 0 and False).
            text = "" if value is None else str(value)
            return text.replace("\r", "").replace("\n", "")

        values = {
            "status": summary.get("status", ""),
            "critical_count": summary.get("critical_count", 0),
            "high_count": summary.get("high_count", 0),
            "medium_count": summary.get("medium_count", 0),
            "baseline_new_count": baseline.get("new_count", 0),
            "baseline_matched_count": baseline.get("matched_count", 0),
            "baseline_resolved_count": baseline.get("resolved_count", 0),
            "adk_agent_count": adk_surface.get("agent_count", 0),
            "adk_dynamic_toolset_count": adk_surface.get("dynamic_toolset_count", 0),
            "report_json": report_json,
            "report_markdown": report_markdown,
            "report_sarif": report_sarif,
            "verifier_json": verifier_json,
            "pr_comment_markdown": pr_comment_markdown,
            "decision": release_decision.get("decision", ""),
            "blocker_count": len(release_decision.get("blockers") or []),
            "review_item_count": len(release_decision.get("review_items") or []),
            # v0.8+ output. Pinned older package versions emit no release_decision,
            # so this stays false until the workflow installs v0.8+.
            "ci_would_fail": str(bool(fail_policy.get("would_fail_ci"))).lower(),
            "diff_enabled": str(bool(tool_surface_diff.get("enabled"))).lower(),
            "action_diff_enabled": str(bool(action_surface_diff.get("enabled"))).lower(),
            "actions_added": action_diff_summary.get("actions_added", 0),
            "actions_modified": action_diff_summary.get("actions_modified", 0),
            "actions_removed": action_diff_summary.get("actions_removed", 0),
            # v0.22 verifier (merge-decision) projection. Sourced from
            # verifier.json so they populate on skip and run alike.
            "should_run": str(bool(trigger.get("should_run"))).lower(),
            "trigger_rule_ids": trigger_rule_ids,
            "merge_verdict": verifier.get("merge_verdict", ""),
            "can_merge_without_human": str(
                bool(verifier.get("can_merge_without_human"))
            ).lower(),
            "trust_root_touched": str(bool(verifier.get("trust_root_touched"))).lower(),
            # SHIP-VERIFY-POLICY-WEAKENED (semantic policy-weakening detection)
            # is a future trust-root pass; constant false until it ships so
            # consumers do not read a false signal as "no weakening detected".
            "policy_weakened": "false",
            "capability_changes_added": cap_added,
            "capability_changes_modified": cap_modified,
            "capability_changes_removed": cap_removed,
        }
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            for key, value in values.items():
                output.write(f"{key}={clean(value)}\n")

        step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if step_summary:
            blocker_count = len(release_decision.get("blockers") or [])
            review_item_count = len(release_decision.get("review_items") or [])
            would_fail_ci = str(bool(fail_policy.get("would_fail_ci"))).lower()
            with open(step_summary, "a", encoding="utf-8") as summary_file:
                summary_file.write("## Agents Shipgate\n\n")
                if release_decision:
                    summary_file.write(
                        f"- Decision: `{clean(release_decision.get('decision'))}`\n"
                    )
                    agent_summary = payload.get("agent_summary") or {}
                    if agent_summary.get("headline"):
                        summary_file.write(
                            f"- Summary: {clean(agent_summary.get('headline'))}\n"
                        )
                    summary_file.write(f"- Blockers: {blocker_count}\n")
                    summary_file.write(f"- Review items: {review_item_count}\n")
                    evidence = release_decision.get("evidence_coverage") or {}
                    ev_parts = []
                    if evidence.get("low_confidence_tool_count"):
                        ev_parts.append(
                            f"{clean(evidence.get('low_confidence_tool_count'))} "
                            "low-confidence tool(s)"
                        )
                    if evidence.get("source_warning_count"):
                        ev_parts.append(
                            f"{clean(evidence.get('source_warning_count'))} "
                            "source warning(s)"
                        )
                    if evidence.get("human_review_recommended"):
                        ev_parts.append("human review recommended")
                    ev_suffix = f" ({'; '.join(ev_parts)})" if ev_parts else ""
                    summary_file.write(
                        f"- Evidence coverage: {clean(evidence.get('level', 'unknown'))}"
                        f"{ev_suffix}\n"
                    )
                    summary_file.write(
                        "- Fail policy: "
                        f"would_fail_ci=`{would_fail_ci}` "
                        f"(exit {clean(fail_policy.get('exit_code'))})\n"
                    )
                else:
                    summary_file.write(f"- Status: `{clean(summary.get('status'))}`\n")
                    summary_file.write(
                        f"- Critical: {clean(summary.get('critical_count', 0))} · "
                        f"High: {clean(summary.get('high_count', 0))} · "
                        f"Medium: {clean(summary.get('medium_count', 0))}\n"
                    )
                if action_surface_diff.get("enabled"):
                    summary_file.write(
                        "- Action Surface Diff: "
                        f"+{clean(action_diff_summary.get('actions_added', 0))} actions, "
                        f"-{clean(action_diff_summary.get('actions_removed', 0))} actions, "
                        f"{clean(action_diff_summary.get('actions_modified', 0))} modified, "
                        f"{clean(action_diff_summary.get('blocking_findings', 0))} "
                        "blocking finding(s)\n"
                    )
                elif action_surface_diff.get("notes"):
                    summary_file.write(
                        "- Action-surface diff: "
                        f"{clean(action_surface_diff.get('notes')[0])}\n"
                    )
                if tool_surface_diff.get("enabled"):
                    summary_file.write(
                        "- What changed: "
                        f"+{clean(diff_summary.get('tools_added', 0))} tools, "
                        f"-{clean(diff_summary.get('tools_removed', 0))} tools, "
                        f"{clean(diff_summary.get('tools_changed', 0))} changed, "
                        f"{clean(diff_summary.get('new_high_risk_effects', 0))} "
                        "new high-risk effect(s), "
                        f"{clean(diff_summary.get('new_findings', 0))} "
                        "new finding(s)\n"
                    )
                elif tool_surface_diff.get("notes"):
                    summary_file.write(
                        f"- Tool-surface diff: {clean(tool_surface_diff.get('notes')[0])}\n"
                    )
                summary_file.write(f"- Report JSON: `{clean(report_json)}`\n")
        PY

    - name: Upload Agents Shipgate report
      if: ${{ always() && inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: agents-shipgate-report
        path: ${{ inputs.output_dir }}/
        if-no-files-found: warn

    - name: Comment on pull request
      if: ${{ always() && inputs.pr_comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
      with:
        github-token: ${{ inputs.github_token || github.token }}
        script: |
          const fs = require("fs");
          const path = require("path");
          const outputDir = process.env.OUTPUT_DIR || "agents-shipgate-reports";
          const commentPath = path.join(outputDir, "pr-comment.md");
          if (!fs.existsSync(commentPath)) {
            core.warning(`Agents Shipgate PR comment not found at ${commentPath}`);
            return;
          }
          const STICKY = "<!-- agents-shipgate-pr-comment -->";
          const body = fs.readFileSync(commentPath, "utf8").slice(0, 6000);
          // Upsert via sticky marker so re-runs update the existing comment instead of spamming the PR.
          // Paginate the lookup — single-page (per_page=100) misses the marker on PRs with >100
          // earlier comments before Shipgate's first run, which would silently regress to append-only.
          const allComments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const prior = allComments.find((c) => c.body && c.body.startsWith(STICKY));
          if (prior) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: prior.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Apply Agents Shipgate exit code
      if: ${{ always() && steps.scan.outputs.exit_code != '' && steps.scan.outputs.exit_code != '0' }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
      run: exit "${EXIT_CODE}"
