name: Agents Shipgate
description: >-
  The deterministic merge gate for AI-generated agent capability changes.
  Review PR changes to declared coding-agent settings, MCP bindings, hooks
  and workflow permissions without a manifest or saved baseline. Separately,
  verify declared application-agent tool surfaces from MCP, OpenAPI,
  OpenAI Agents SDK, Anthropic, Google ADK, LangChain, CrewAI, OpenAI API,
  Codex config, Codex plugin, n8n, and Conductor OSS workflow JSON artifacts.
  Host comparisons are
  static and advisory, name coverage limits, and imply no verdict. Verification
  artifacts and the configured release gate retain their own control rules.
  Local-first and static-by-default. Apache-2.0.
author: ThreeMoonsLab

branding:
  icon: shield
  color: blue

inputs:
  application:
    required: false
    default: "false"
    description: "Opt in to manifest-free, advisory application comparison. Uses exact PR base/head SHAs; checkout must provide full history and objects. Verifier options do not apply."
  application_scope:
    required: false
    default: ""
    description: "Optional repository-relative application scope. Empty derives scope from the PR change."
  application_fail_on:
    required: false
    default: ""
    description: "Optional comma-separated application comparison statuses that fail CI: compared, partial, not_established. Empty is advisory. Execution refusals still fail."
  config:
    required: false
    default: shipgate.yaml
    description: Path to shipgate.yaml.
  ci_mode:
    required: false
    default: advisory
    description: advisory or strict.
  fail_on:
    required: false
    default: ""
    description: Optional comma-separated severities that fail CI, for example critical,high.
  fail_on_merge_verdicts:
    required: false
    default: ""
    description: "Optional comma-separated merge verdicts that fail CI. Supported values: blocked, human_review_required, insufficient_evidence, unknown, mergeable."
  baseline:
    required: false
    default: ""
    description: Optional local baseline JSON path. Strict mode fails only on new findings.
  diff_from:
    required: false
    default: ""
    description: Optional prior report.json or v0.4 baseline JSON for tool/action surface diff.
  diff_base:
    required: false
    default: ""
    description: Set to target to use the locally available pull request base branch for diff.
  verify_mode:
    required: false
    default: verify
    description: "Verifier mode for the Action. Supported values: verify (default) or scan for legacy direct-scan execution."
  base_ref:
    required: false
    default: ""
    description: Optional local base ref/SHA; application defaults to the PR base SHA. With diff_base=target on pull_request, defaults to origin/<github.base_ref>. The action never fetches.
  head_ref:
    required: false
    default: ""
    description: Optional local head ref/SHA for PR diff and scan. Omit to scan the checked-out workspace in verifier/scan mode. Application defaults to the PR head SHA.
  baseline_mode:
    required: false
    default: new-findings
    description: "Baseline comparison mode. Supported value: new-findings."
  policy_packs:
    required: false
    default: ""
    description: Optional comma- or newline-separated declarative YAML policy pack paths.
  no_plugins:
    required: false
    default: "false"
    description: Force third-party check plugins off even when AGENTS_SHIPGATE_ENABLE_PLUGINS is set.
  output_dir:
    required: false
    default: agents-shipgate-reports
    description: Output directory for reports. verify refuses (exit 2) a directory inside the repository that holds committed files or unignored files other than Shipgate artifacts, or that lies in a trust root Git does not ignore.
  upload_artifact:
    required: false
    default: "true"
    description: Upload reports as a workflow artifact. For a run without a validated verification result the artifact is the output directory as found, kept for diagnosis; nothing in it is validated as that run's result.
  check_annotations:
    required: false
    default: "true"
    description: Emit GitHub Actions job annotations for source-backed blockers and review items.
  check_annotation_limit:
    required: false
    default: "50"
    description: Maximum number of GitHub Actions annotations to emit.
  pr_comment:
    required: false
    default: "false"
    description: Post a short PR comment when running on pull_request. A run without a validated verification result posts a short note saying so instead of a review.
  pr_comment_style:
    required: false
    default: capability-review
    description: "PR comment renderer. Supported values: capability-review (default) or findings for the legacy v1 findings comment."
  check_run:
    required: false
    default: "false"
    description: >-
      Create/update a GitHub Check Run named by check_run_name with the
      merge verdict as the check conclusion (mergeable=success,
      blocked=failure, otherwise neutral) and up to 50 line-level
      annotations from the PR projection. The verdict is read only from
      evidence the outputs step validated for this run: a run without a
      validated result states no verdict, and success needs this run's
      terminal receipt. Requires `checks: write` permission on the workflow.
  check_run_policy:
    required: false
    default: advisory
    description: "Check Run conclusion policy: advisory, blocked-fails, or require-mergeable. Any other value fails the job before the scan. blocked-fails and require-mergeable read the merge verdict in verifier.json, which verify_mode scan does not write, so they require verify_mode verify."
  check_run_name:
    required: false
    default: "Agents Shipgate"
    description: Name of the check run created when check_run is true.
  github_token:
    required: false
    default: ""
    description: Token for optional PR comments. The PR comment is updated in place only when github-actions[bot] posted it, so a token for another identity adds a new comment on each run.
  shipgate_version:
    required: false
    default: ""
    description: Optional Agents Shipgate PyPI version to install. It must name one exact release, 1.0.0 or later; a range or wildcard is refused, and an older release is refused as a version skew. Empty installs this action source. Either way the engine goes into a virtual environment of the Action's own, over this Action's hash-locked constraints/action-runtime.txt, with --no-deps.
  shipgate_wheel:
    required: false
    default: ""
    description: Optional exact candidate wheel inside GITHUB_WORKSPACE. Requires shipgate_wheel_sha256; cannot be combined with shipgate_version. Installed with --no-deps over the same hash-locked runtime as the other routes.
  shipgate_wheel_sha256:
    required: false
    default: ""
    description: Full lowercase SHA-256 of shipgate_wheel. The Action checks and installs the same captured bytes.
  attestation:
    required: false
    default: "false"
    description: Emit agents-shipgate-reports/attestation.json from verifier.json/report.json, only for a run with a validated verification result.
  registry_repo_label:
    required: false
    default: ""
    description: Optional repository label copied into attestation org context.
  org_bundle:
    required: false
    default: "false"
    description: Emit agents-shipgate-reports/org-evidence-bundle.json for org/fleet aggregation, only for a run with a validated verification result.
  host_audit:
    required: false
    default: "false"
    description: Emit agents-shipgate-reports/host-grants.json from audit --host.
  org_status:
    required: false
    default: "false"
    description: Emit agents-shipgate-reports/org-status.json from org status.
  registry_path:
    required: false
    default: ""
    description: Optional registry path label embedded in org bundle metadata; never mutated by this action.

outputs:
  # Legacy v0.7-caller output; baseline-blind. Prefer release_decision.decision
  # via the `decision` output below for gating.
  status:
    description: Agents Shipgate summary status (legacy v0.7 caller; baseline-blind).
    value: ${{ steps.report_outputs.outputs.status }}
  application_status:
    description: "Application comparison status: compared, partial, not_established, or refused. Not a merge verdict."
    value: ${{ steps.scan.outputs.application_status }}
  application_json:
    description: Path to the application comparison JSON; empty on refusal.
    value: ${{ steps.scan.outputs.application_json }}
  application_markdown:
    description: Path to the complete application review, including limits.
    value: ${{ steps.scan.outputs.application_markdown }}
  critical_count:
    description: Number of unsuppressed critical findings.
    value: ${{ steps.report_outputs.outputs.critical_count }}
  high_count:
    description: Number of unsuppressed high findings.
    value: ${{ steps.report_outputs.outputs.high_count }}
  medium_count:
    description: Number of unsuppressed medium findings.
    value: ${{ steps.report_outputs.outputs.medium_count }}
  baseline_new_count:
    description: Number of new findings when a baseline is used.
    value: ${{ steps.report_outputs.outputs.baseline_new_count }}
  baseline_matched_count:
    description: Number of baseline-matched findings when a baseline is used.
    value: ${{ steps.report_outputs.outputs.baseline_matched_count }}
  baseline_resolved_count:
    description: Number of baseline findings resolved by the current scan.
    value: ${{ steps.report_outputs.outputs.baseline_resolved_count }}
  adk_agent_count:
    description: Number of Google ADK agents statically detected.
    value: ${{ steps.report_outputs.outputs.adk_agent_count }}
  adk_dynamic_toolset_count:
    description: Number of Google ADK toolsets that were dynamic or unresolved.
    value: ${{ steps.report_outputs.outputs.adk_dynamic_toolset_count }}
  report_json:
    description: Path to the generated JSON report.
    value: ${{ steps.report_outputs.outputs.report_json }}
  report_markdown:
    description: Path to the generated Markdown report.
    value: ${{ steps.report_outputs.outputs.report_markdown }}
  report_sarif:
    description: Path to the generated SARIF report.
    value: ${{ steps.report_outputs.outputs.report_sarif }}
  verifier_json:
    description: Path to verifier.json.
    value: ${{ steps.report_outputs.outputs.verifier_json }}
  verify_run_json:
    description: Path to verify-run.json.
    value: ${{ steps.report_outputs.outputs.verify_run_json }}
  agent_handoff_json:
    description: Path to agent-handoff.json.
    value: ${{ steps.report_outputs.outputs.agent_handoff_json }}
  verification_receipt_json:
    description: Path to the validated terminal verification receipt.
    value: ${{ steps.report_outputs.outputs.verification_receipt_json }}
  request_id:
    description: Content-addressed verification request identity.
    value: ${{ steps.report_outputs.outputs.request_id }}
  receipt_id:
    description: Content-addressed terminal receipt identity.
    value: ${{ steps.report_outputs.outputs.receipt_id }}
  decision_id:
    description: Content-addressed assembled decision identity.
    value: ${{ steps.report_outputs.outputs.decision_id }}
  artifact_set_id:
    description: Content-addressed artifact-set identity.
    value: ${{ steps.report_outputs.outputs.artifact_set_id }}
  run_id:
    description: Deterministic verify-run input identity from verify-run.json.
    value: ${{ steps.report_outputs.outputs.run_id }}
  pr_comment_markdown:
    description: Path to the generated PR comment Markdown.
    value: ${{ steps.report_outputs.outputs.pr_comment_markdown }}
  check_annotations_json:
    description: Path to generated GitHub Actions annotation payload.
    value: ${{ steps.report_outputs.outputs.check_annotations_json }}
  capability_lock_json:
    description: Path to generated head capability lock JSON.
    value: ${{ steps.report_outputs.outputs.capability_lock_json }}
  base_capability_lock_json:
    description: Path to generated base capability lock JSON when base diff is available.
    value: ${{ steps.report_outputs.outputs.base_capability_lock_json }}
  capability_lock_diff_json:
    description: Path to generated capability lock diff JSON when base and head locks are available.
    value: ${{ steps.report_outputs.outputs.capability_lock_diff_json }}
  attestation_json:
    description: Path to generated release attestation JSON when attestation is true.
    value: ${{ steps.report_outputs.outputs.attestation_json }}
  org_evidence_bundle_json:
    description: Path to generated organization evidence bundle JSON when org_bundle is true.
    value: ${{ steps.report_outputs.outputs.org_evidence_bundle_json }}
  host_grants_json:
    description: Path to generated host-grants inventory JSON when host_audit is true.
    value: ${{ steps.report_outputs.outputs.host_grants_json }}
  org_status_json:
    description: Path to generated organization status JSON when org_status is true.
    value: ${{ steps.report_outputs.outputs.org_status_json }}
  exit_code:
    description: Agents Shipgate CLI exit code.
    value: ${{ steps.scan.outputs.exit_code }}
  cli_path:
    description: Path to the installed agents-shipgate command. Its directory, which holds only agents-shipgate and shipgate, is added to PATH for later steps; the Action's Python is not.
    value: ${{ steps.install.outputs.cli }}
  decision:
    description: Release decision (`blocked`, `review_required`, `insufficient_evidence`, or `passed`). v0.8+; `insufficient_evidence` added v0.14.
    value: ${{ steps.report_outputs.outputs.decision }}
  blocker_count:
    description: Number of blockers in release_decision (v0.8+).
    value: ${{ steps.report_outputs.outputs.blocker_count }}
  review_item_count:
    description: Number of review items in release_decision (v0.8+).
    value: ${{ steps.report_outputs.outputs.review_item_count }}
  ci_would_fail:
    description: Whether the active fail policy would fail CI (`true`/`false`). v0.8+.
    value: ${{ steps.report_outputs.outputs.ci_would_fail }}
  diff_enabled:
    description: Whether tool_surface_diff was enabled in report.json.
    value: ${{ steps.report_outputs.outputs.diff_enabled }}
  action_diff_enabled:
    description: Whether action_surface_diff was enabled in report.json.
    value: ${{ steps.report_outputs.outputs.action_diff_enabled }}
  actions_added:
    description: Number of actions added by Action Surface Diff.
    value: ${{ steps.report_outputs.outputs.actions_added }}
  actions_modified:
    description: Number of actions modified by Action Surface Diff.
    value: ${{ steps.report_outputs.outputs.actions_modified }}
  actions_removed:
    description: Number of actions removed by Action Surface Diff.
    value: ${{ steps.report_outputs.outputs.actions_removed }}
  should_run:
    description: Trigger evaluator should_run value from verifier.json (`true`/`false`).
    value: ${{ steps.report_outputs.outputs.should_run }}
  trigger_action:
    description: >-
      Final trigger action (`force_run`, `run_shipgate`, `skip_shipgate`,
      `dry_run`, `withheld`, or `none`). `withheld` means the evaluator
      published no verdict — read `trigger_evaluation_status` to tell which
      of the two withheld states applies. Never treat it as a skip.
    value: ${{ steps.report_outputs.outputs.trigger_action }}
  trigger_evaluation_status:
    description: >-
      Trigger evaluation status (`evaluated`, `unclassified`, or
      `not_evaluated`). `unclassified` means the diff was read in full and no
      rule classified it — run the scan. `not_evaluated` means the diff could
      not be read — repair the input. `should_run` is empty for both.
    value: ${{ steps.report_outputs.outputs.trigger_evaluation_status }}
  trigger_rule_ids:
    description: Comma-separated trigger rule IDs that matched.
    value: ${{ steps.report_outputs.outputs.trigger_rule_ids }}
  verifier_verdict:
    description: Verifier convenience verdict. Prefer `decision` for CI gating; projected from release_decision.
    value: ${{ steps.report_outputs.outputs.verifier_verdict }}
  merge_verdict:
    description: "PR/controller verdict projected from release_decision (`mergeable`, `human_review_required`, `insufficient_evidence`, `blocked`, or `unknown`). Use `decision` for CI gating."
    value: ${{ steps.report_outputs.outputs.merge_verdict }}
  can_merge_without_human:
    description: True only for a verified passed result or a completed deterministic not-applicable skip.
    value: ${{ steps.report_outputs.outputs.can_merge_without_human }}
  agent_control_state:
    description: Authoritative agent control state (`complete`, `agent_action_required`, `review_publishable`, or `human_review_required`). `review_publishable` authorizes commit/push/PR updates while denying merge and completion.
    value: ${{ steps.report_outputs.outputs.agent_control_state }}
  agent_control_reason:
    description: Deterministic reason for the authoritative agent control state.
    value: ${{ steps.report_outputs.outputs.agent_control_reason }}
  agent_controller_must_stop:
    description: Compatibility mirror of verifier.json.control.must_stop (`true`/`false`).
    value: ${{ steps.report_outputs.outputs.agent_controller_must_stop }}
  agent_controller_stop_reason:
    description: Compatibility mirror of verifier.json.control.stop_reason.
    value: ${{ steps.report_outputs.outputs.agent_controller_stop_reason }}
  agent_controller_completion_allowed:
    description: Compatibility mirror of verifier.json.control.completion_allowed (`true`/`false`).
    value: ${{ steps.report_outputs.outputs.agent_controller_completion_allowed }}
  trust_root_touched:
    description: Whether verifier_summary reports a touched release trust root (`true`/`false`). Review signal; not a second gate.
    value: ${{ steps.report_outputs.outputs.trust_root_touched }}
  policy_weakened:
    description: Whether verifier_summary reports a policy weakening (`true`/`false`). Review signal; not a second gate.
    value: ${{ steps.report_outputs.outputs.policy_weakened }}
  capability_changes_added:
    description: Supporting/provisional count of added members in the capability delta; not a second gate.
    value: ${{ steps.report_outputs.outputs.capability_changes_added }}
  capability_changes_modified:
    description: Supporting/provisional count of broadened plus narrowed capability delta members; not a second gate.
    value: ${{ steps.report_outputs.outputs.capability_changes_modified }}
  capability_changes_removed:
    description: Supporting/provisional count of removed members in the capability delta; not a second gate.
    value: ${{ steps.report_outputs.outputs.capability_changes_removed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: "3.12"
        # This interpreter only creates the engine's own virtual environment,
        # called by path: the caller's later steps keep the Python and PATH
        # they set up, plus the CLI directory the install step adds.
        update-environment: false

    - name: Install Agents Shipgate
      id: install
      shell: bash
      env:
        # The runner's interpreter, which only creates the engine's own
        # environment; every later step runs that environment's interpreter.
        SHIPGATE_PYTHON: ${{ steps.python.outputs.python-path }}
        SHIPGATE_VERSION: ${{ inputs.shipgate_version }}
        SHIPGATE_WHEEL: ${{ inputs.shipgate_wheel }}
        SHIPGATE_WHEEL_SHA256: ${{ inputs.shipgate_wheel_sha256 }}
      run: |
        # This step runs in GITHUB_WORKSPACE, the pull request's own files.
        # `python -m` puts that directory first on sys.path, so a PR adding
        # `pip/__main__.py` would run before the engine is installed; `-P`
        # leaves it off. A script path puts the script's directory first, not
        # the workspace, and the installer passes `-P` to its own pip.
        #
        # The installer recreates the virtual environment at the fixed path
        # RUNNER_TEMP/.agents-shipgate-action/venv from this interpreter (a fixed path
        # keeps engine_requirement_id the same on every run), installs
        # constraints/action-runtime.txt into it with --require-hashes and then
        # the engine with --no-deps (#1032), and writes its interpreter
        # (`python`), scripts (`bin`) and CLI (`cli`). Only a directory holding
        # `agents-shipgate` and `shipgate` goes on GITHUB_PATH.
        "${SHIPGATE_PYTHON}" "${GITHUB_ACTION_PATH}/scripts/install_action_engine.py" --venv-parent "${RUNNER_TEMP}"

    - name: Validate Agents Shipgate check-run policy
      if: ${{ inputs.check_run == 'true' }}
      shell: bash
      env:
        SHIPGATE_PYTHON: ${{ steps.install.outputs.python }}
        CHECK_RUN_POLICY: ${{ inputs.check_run_policy }}
        VERIFY_MODE: ${{ inputs.verify_mode }}
      run: |
        "${SHIPGATE_PYTHON}" "${GITHUB_ACTION_PATH}/scripts/github_check_run.py" --check-policy

    - name: Run Agents Shipgate
      id: scan
      shell: bash
      env:
        SHIPGATE_PYTHON: ${{ steps.install.outputs.python }}
        SHIPGATE_BIN: ${{ steps.install.outputs.bin }}
        CONFIG: ${{ inputs.config }}
        CI_MODE: ${{ inputs.ci_mode }}
        FAIL_ON: ${{ inputs.fail_on }}
        BASELINE: ${{ inputs.baseline }}
        BASELINE_MODE: ${{ inputs.baseline_mode }}
        DIFF_FROM: ${{ inputs.diff_from }}
        DIFF_BASE: ${{ inputs.diff_base }}
        VERIFY_MODE: ${{ inputs.verify_mode }}
        INPUT_BASE_REF: ${{ inputs.base_ref }}
        INPUT_HEAD_REF: ${{ inputs.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        EVENT_NAME: ${{ github.event_name }}
        EVALUATED_HEAD_SHA: ${{ github.sha }}
        POLICY_PACKS: ${{ inputs.policy_packs }}
        NO_PLUGINS: ${{ inputs.no_plugins }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        PR_COMMENT_STYLE: ${{ inputs.pr_comment_style }}
        APPLICATION: ${{ inputs.application }}
        APPLICATION_SCOPE: ${{ inputs.application_scope }}
        APPLICATION_FAIL_ON: ${{ inputs.application_fail_on }}
        APPLICATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        APPLICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FAIL_ON_MERGE_VERDICTS: ${{ inputs.fail_on_merge_verdicts }}
        ATTESTATION: ${{ inputs.attestation }}
        ORG_BUNDLE: ${{ inputs.org_bundle }}
        HOST_AUDIT: ${{ inputs.host_audit }}
        ORG_STATUS: ${{ inputs.org_status }}
        CHECK_RUN: ${{ inputs.check_run }}
      run: |
        if [ "${APPLICATION}" = "true" ]; then
          echo "execution_mode=application" >> "${GITHUB_OUTPUT}"
          set +e
          "${SHIPGATE_PYTHON}" "${GITHUB_ACTION_PATH}/scripts/github_action_application.py"
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0
        elif [ "${APPLICATION}" != "false" ]; then
          echo "application must be 'true' or 'false'." >&2
          echo "exit_code=2" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        if [ "${VERIFY_MODE}" = "verify" ]; then
          args=(
            verify
            --workspace "."
            --config "${CONFIG}"
            --ci-mode "${CI_MODE}"
            --out "${OUTPUT_DIR}"
            --format json
            --pr-comment-style "${PR_COMMENT_STYLE}"
          )
        elif [ "${VERIFY_MODE}" = "scan" ]; then
          args=(
            scan
            --config "${CONFIG}"
            --ci-mode "${CI_MODE}"
            --out "${OUTPUT_DIR}"
            --format markdown,json,sarif
            --packet-format json
          )
        else
          echo "verify_mode must be 'verify' or 'scan'." >&2
          echo "exit_code=2" >> "${GITHUB_OUTPUT}"
          exit 2
        fi
        if [ -n "${FAIL_ON}" ]; then
          args+=(--fail-on "${FAIL_ON}")
        fi
        if [ -n "${BASELINE}" ]; then
          args+=(--baseline "${BASELINE}" --baseline-mode "${BASELINE_MODE}")
        fi
        if [ -n "${DIFF_FROM}" ]; then
          args+=(--diff-from "${DIFF_FROM}")
        fi
        if [ "${VERIFY_MODE}" = "verify" ]; then
          resolved_base_ref="${INPUT_BASE_REF}"
          if [ -z "${resolved_base_ref}" ] && [ "${DIFF_BASE}" = "target" ] && [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_REF}" ]; then
            resolved_base_ref="origin/${BASE_REF}"
          fi
          if [ -n "${resolved_base_ref}" ]; then
            args+=(--base "${resolved_base_ref}")
          fi
          if [ -n "${INPUT_HEAD_REF}" ]; then
            args+=(--head "${INPUT_HEAD_REF}")
          elif [ -n "${EVALUATED_HEAD_SHA}" ]; then
            args+=(--head "${EVALUATED_HEAD_SHA}")
          fi
        fi
        if [ -n "${POLICY_PACKS}" ]; then
          while IFS= read -r policy_pack; do
            [ -z "${policy_pack}" ] && continue
            args+=(--policy-pack "${policy_pack}")
          done < <(printf '%s\n' "${POLICY_PACKS}" | tr ',' '\n')
        fi
        if [ "${NO_PLUGINS}" = "true" ]; then
          args+=(--no-plugins)
        fi
        echo "execution_mode=manifest" >> "${GITHUB_OUTPUT}"
        set +e
        "${SHIPGATE_BIN}/agents-shipgate" "${args[@]}"
        exit_code=$?
        echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
        exit 0

    # The attestation and org bundle steps run before the outputs step, so each
    # asks the outputs script's own validation, bound to this run, whether the
    # directory holds a result this run published (#1165).
    - name: Build Agents Shipgate attestation
      if: ${{ always() && steps.scan.outputs.execution_mode == 'manifest' && inputs.attestation == 'true' }}
      shell: bash
      env:
        SHIPGATE_PYTHON: ${{ steps.install.outputs.python }}
        SHIPGATE_BIN: ${{ steps.install.outputs.bin }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        CONFIG: ${{ inputs.config }}
        REGISTRY_REPO_LABEL: ${{ inputs.registry_repo_label }}
        SHIPGATE_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        INPUT_HEAD_REF: ${{ inputs.head_ref }}
        EVALUATED_HEAD_SHA: ${{ github.sha }}
      run: |
        # Any attestation already in the directory is not this run's: only the
        # one `attest` writes below may be left there.
        rm -f -- "${OUTPUT_DIR}/attestation.json"
        if [ ! -f "${OUTPUT_DIR}/verifier.json" ]; then
          echo "Agents Shipgate verifier.json not found; attestation skipped." >&2
        elif ! "${SHIPGATE_PYTHON}" "${GITHUB_ACTION_PATH}/scripts/github_action_outputs.py" --check-evidence; then
          echo "Agents Shipgate attestation skipped: this run has no validated result." >&2
        else
          args=(
            attest
            --from "${OUTPUT_DIR}/verifier.json"
            --out "${OUTPUT_DIR}/attestation.json"
            --config "${CONFIG}"
            --ci-context github-actions
          )
          if [ -n "${REGISTRY_REPO_LABEL}" ]; then
            args+=(--repo "${REGISTRY_REPO_LABEL}")
          fi
          "${SHIPGATE_BIN}/agents-shipgate" "${args[@]}"
        fi

    - name: Build Agents Shipgate host audit
      if: ${{ always() && steps.scan.outputs.execution_mode == 'manifest' && inputs.host_audit == 'true' }}
      shell: bash
      env:
        SHIPGATE_BIN: ${{ steps.install.outputs.bin }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
      run: |
        mkdir -p "${OUTPUT_DIR}"
        "${SHIPGATE_BIN}/shipgate" audit --host --workspace "." --json \
          --out "${OUTPUT_DIR}/host-grants.json" >/dev/null || \
          echo "Agents Shipgate host audit failed; artifact skipped." >&2

    - name: Build Agents Shipgate org status
      if: ${{ always() && steps.scan.outputs.execution_mode == 'manifest' && inputs.org_status == 'true' }}
      shell: bash
      env:
        SHIPGATE_BIN: ${{ steps.install.outputs.bin }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        CONFIG: ${{ inputs.config }}
      run: |
        mkdir -p "${OUTPUT_DIR}"
        set +e
        "${SHIPGATE_BIN}/agents-shipgate" org status --config "${CONFIG}" --workspace "." --json \
          > "${OUTPUT_DIR}/org-status.json"
        status_code=$?
        set -e
        if [ "${status_code}" != "0" ] && [ "${status_code}" != "20" ]; then
          echo "Agents Shipgate org status failed with ${status_code}." >&2
        fi

    - name: Build Agents Shipgate org evidence bundle
      if: ${{ always() && steps.scan.outputs.execution_mode == 'manifest' && inputs.org_bundle == 'true' }}
      shell: bash
      env:
        SHIPGATE_PYTHON: ${{ steps.install.outputs.python }}
        SHIPGATE_BIN: ${{ steps.install.outputs.bin }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        CONFIG: ${{ inputs.config }}
        REGISTRY_PATH: ${{ inputs.registry_path }}
        SHIPGATE_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        INPUT_HEAD_REF: ${{ inputs.head_ref }}
        EVALUATED_HEAD_SHA: ${{ github.sha }}
      run: |
        mkdir -p "${OUTPUT_DIR}"
        # Any bundle already in the directory is not this run's: only the one
        # `org bundle` writes below may be left there.
        rm -f -- "${OUTPUT_DIR}/org-evidence-bundle.json"
        if [ ! -f "${OUTPUT_DIR}/verifier.json" ]; then
          echo "Agents Shipgate verifier.json not found; org bundle skipped." >&2
        elif ! "${SHIPGATE_PYTHON}" "${GITHUB_ACTION_PATH}/scripts/github_action_outputs.py" --check-evidence; then
          echo "Agents Shipgate org bundle skipped: this run has no validated result." >&2
        else
          args=(
            org
            bundle
            --config "${CONFIG}"
            --workspace "."
            --from "${OUTPUT_DIR}/verifier.json"
            --out "${OUTPUT_DIR}/org-evidence-bundle.json"
            --json
          )
          if [ -n "${REGISTRY_PATH}" ]; then
            args+=(--registry "${REGISTRY_PATH}")
          fi
          "${SHIPGATE_BIN}/agents-shipgate" "${args[@]}" >/dev/null || \
            echo "Agents Shipgate org evidence bundle failed; artifact skipped." >&2
        fi

    - name: Extract Agents Shipgate outputs
      id: report_outputs
      if: ${{ always() && steps.scan.outputs.execution_mode == 'manifest' }}
      shell: bash
      env:
        SHIPGATE_PYTHON: ${{ steps.install.outputs.python }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        # What the run step did: a receipt counts only after a CLI that
        # completed, for the repository and head it evaluated (#1165).
        SHIPGATE_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        INPUT_HEAD_REF: ${{ inputs.head_ref }}
        EVALUATED_HEAD_SHA: ${{ github.sha }}
      run: |
        "${SHIPGATE_PYTHON}" "${GITHUB_ACTION_PATH}/scripts/github_action_outputs.py"

    # Annotations come only from a run whose evidence the outputs step
    # validated for this run (#1165).
    - name: Emit Agents Shipgate annotations
      if: ${{ always() && steps.scan.outputs.execution_mode == 'manifest' && inputs.check_annotations == 'true' && steps.report_outputs.outputs.evidence == 'validated' }}
      shell: bash
      env:
        SHIPGATE_PYTHON: ${{ steps.install.outputs.python }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        CHECK_ANNOTATION_LIMIT: ${{ inputs.check_annotation_limit }}
      run: |
        "${SHIPGATE_PYTHON}" "${GITHUB_ACTION_PATH}/scripts/github_action_annotations.py"

    - name: Upload Agents Shipgate report
      if: ${{ always() && inputs.upload_artifact == 'true' && (steps.scan.outputs.execution_mode == 'manifest' || (steps.scan.outputs.execution_mode == 'application' && steps.scan.outputs.application_reports != '')) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.scan.outputs.execution_mode == 'application' && 'agents-shipgate-application-review' || 'agents-shipgate-report' }}
        path: ${{ steps.scan.outputs.execution_mode == 'application' && steps.scan.outputs.application_reports || inputs.output_dir }}/
        if-no-files-found: warn

    - name: Comment on pull request
      if: ${{ always() && inputs.pr_comment == 'true' && github.event_name == 'pull_request' && (steps.scan.outputs.execution_mode == 'manifest' || (steps.scan.outputs.execution_mode == 'application' && steps.scan.outputs.application_reports != '')) }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        OUTPUT_DIR: ${{ steps.scan.outputs.execution_mode == 'application' && steps.scan.outputs.application_reports || inputs.output_dir }}
        APPLICATION: ${{ steps.scan.outputs.execution_mode == 'application' }}
        EVIDENCE: ${{ steps.report_outputs.outputs.evidence }}
      with:
        github-token: ${{ inputs.github_token || github.token }}
        script: |
          const fs = require("fs");
          const path = require("path");
          const outputDir = process.env.OUTPUT_DIR || "agents-shipgate-reports";
          const commentPath = path.join(outputDir, "pr-comment.md");
          const application = process.env.APPLICATION === 'true';
          const STICKY = application ? "<!-- agents-shipgate-application-comment -->" : "<!-- agents-shipgate-pr-comment -->";
          // A verifier comment is posted only from a run whose evidence the outputs
          // step validated for this run. Otherwise the comment says so, and replaces
          // an earlier run's review rather than leaving it standing (#1165).
          const validated = application || process.env.EVIDENCE === "validated";
          if (validated && !fs.existsSync(commentPath)) {
            core.warning(`Agents Shipgate PR comment not found at ${commentPath}`);
            return;
          }
          let body = validated
            ? fs.readFileSync(commentPath, "utf8").slice(0, 6000)
            : `${STICKY}\n## Agents Shipgate\n\n` +
              "This run has no validated verification result, so no review is shown. " +
              "The workflow run's log names the error; re-run once it is fixed.";
          const serverUrl = process.env.GITHUB_SERVER_URL || "https://github.com";
          const runId = process.env.GITHUB_RUN_ID;
          const runUrl = `${serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
          const artifactLine = `\n\nWorkflow artifacts: ${runUrl}`;
          if (body.length + artifactLine.length <= 6000) {
            body = `${body}${artifactLine}`;
          }
          // Upsert via sticky marker so re-runs update the existing comment instead of spamming the PR.
          // Paginate the lookup — single-page (per_page=100) misses the marker on PRs with >100
          // earlier comments before Shipgate's first run, which would silently regress to append-only.
          // Only a comment github-actions[bot] posted is ours. Anyone can post one that starts with
          // the marker: updating it would put the review in a comment its author can rewrite, and a
          // refused update would post no review at all (#1032).
          const postedByActions = (c) =>
            Boolean(c.user && c.user.type === "Bot" && c.user.login === "github-actions[bot]");
          try {
            const allComments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const prior = allComments.find(
              (c) => postedByActions(c) && typeof c.body === "string" && c.body.startsWith(STICKY)
            );
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
          } catch (error) {
            const headers = error.response?.headers || {};
            const rateLimited = headers['x-ratelimit-remaining'] === '0' ||
              headers['retry-after'] !== undefined || /rate limit/i.test(error.message || '');
            if (![403, 404].includes(error.status) || rateLimited) throw error;
            const limitation = application
              ? 'PR comment publication is unavailable with this token or PR context. ' +
                'Read the advisory application review below in the workflow summary. No merge verdict is implied.'
              : 'PR comment publication is unavailable with this token or PR context. ' +
                'Read the review below in the workflow summary. No authenticated decision is recorded; ' +
                'the verifier gate and current control still apply.';
            core.warning(limitation);
            await core.summary.addRaw(
              `## Agents Shipgate: PR publication unavailable\n\n${limitation}\n\n${body}\n`
            ).write();
          }

    # Runs under always() so that a failing check is still published. Its
    # verdict comes only through the outputs step's validation, bound to this
    # run; a refused directory gives no verdict, and success also needs the
    # receipt the outputs step validated (#1165).
    - name: Build Agents Shipgate check-run payload
      id: check_run_payload
      if: ${{ always() && steps.scan.outputs.execution_mode == 'manifest' && inputs.check_run == 'true' }}
      shell: bash
      env:
        SHIPGATE_PYTHON: ${{ steps.install.outputs.python }}
        OUTPUT_DIR: ${{ inputs.output_dir }}
        CHECK_RUN_NAME: ${{ inputs.check_run_name }}
        CHECK_RUN_POLICY: ${{ inputs.check_run_policy }}
        VERIFY_MODE: ${{ inputs.verify_mode }}
        SHIPGATE_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        INPUT_HEAD_REF: ${{ inputs.head_ref }}
        EVALUATED_HEAD_SHA: ${{ github.sha }}
        VALIDATED_RECEIPT_ID: ${{ steps.report_outputs.outputs.receipt_id }}
      run: |
        "${SHIPGATE_PYTHON}" "${GITHUB_ACTION_PATH}/scripts/github_check_run.py"

    # Posts only the payload the step above wrote in this run, by its digest.
    - name: Create Agents Shipgate check run
      if: ${{ always() && steps.scan.outputs.execution_mode == 'manifest' && inputs.check_run == 'true' && steps.check_run_payload.outputs.payload_sha256 != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
        PAYLOAD_SHA256: ${{ steps.check_run_payload.outputs.payload_sha256 }}
      with:
        github-token: ${{ inputs.github_token || github.token }}
        script: |
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const outputDir = process.env.OUTPUT_DIR || "agents-shipgate-reports";
          const payloadPath = path.join(outputDir, "check-run-payload.json");
          const expected = process.env.PAYLOAD_SHA256 || "";
          const raw = fs.existsSync(payloadPath) ? fs.readFileSync(payloadPath) : null;
          const digest = raw === null ? "" : crypto.createHash("sha256").update(raw).digest("hex");
          if (!expected || digest !== expected) {
            core.setFailed(
              `Agents Shipgate check-run payload at ${payloadPath} is not the one this run built; ` +
              "no check run was created."
            );
            return;
          }
          const payload = JSON.parse(raw.toString("utf8"));
          // Attach to the PR head SHA, not the synthetic merge commit, so the
          // check shows up on the PR's checks tab and branch protection.
          const headSha = context.payload.pull_request
            ? context.payload.pull_request.head.sha
            : context.sha;
          try {
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: headSha,
              status: "completed",
              ...payload,
            });
          } catch (error) {
            // Forks and minimal tokens lack `checks: write`; degrade to a
            // warning rather than failing the gate step.
            core.warning(`Agents Shipgate check-run creation failed: ${error.message}`);
          }

    - name: Apply Agents Shipgate merge verdict policy
      if: ${{ always() && steps.scan.outputs.execution_mode == 'manifest' && inputs.fail_on_merge_verdicts != '' }}
      shell: bash
      env:
        SHIPGATE_PYTHON: ${{ steps.install.outputs.python }}
        FAIL_ON_MERGE_VERDICTS: ${{ inputs.fail_on_merge_verdicts }}
        MERGE_VERDICT: ${{ steps.report_outputs.outputs.merge_verdict }}
      run: |
        # `-P`: a script read from stdin puts the workspace (the pull
        # request's files) on sys.path ahead of site-packages, where an
        # `agents_shipgate/` package there would stand in for the engine.
        "${SHIPGATE_PYTHON}" -P - <<'PY'
        import os
        import sys

        sys.path.insert(0, os.environ["GITHUB_ACTION_PATH"])

        from scripts.github_action_outputs import merge_verdict_policy_exit_code

        code = merge_verdict_policy_exit_code(
            os.environ.get("MERGE_VERDICT", ""),
            os.environ.get("FAIL_ON_MERGE_VERDICTS", ""),
        )
        if code:
            verdict = os.environ.get("MERGE_VERDICT", "")
            if verdict:
                print(
                    "Agents Shipgate merge verdict "
                    f"{verdict!r} matched fail_on_merge_verdicts.",
                    file=sys.stderr,
                )
            else:
                print(
                    "Agents Shipgate fail_on_merge_verdicts was configured, but "
                    "verifier.json did not expose a merge verdict.",
                    file=sys.stderr,
                )
        raise SystemExit(code)
        PY

    - name: Apply Agents Shipgate exit code
      if: ${{ always() && steps.scan.outputs.exit_code != '' && steps.scan.outputs.exit_code != '0' }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
      run: exit "${EXIT_CODE}"
