# Reconstructed from the stripe/ai "Email Support Agent" + the bounded base
# config (customers.read, invoices.read, billing_portal_sessions.create).
# HEAD side of PR #232 ("[python] Migrate from API to MCP"). The manifest is
# unchanged from base; only support_agent.py changed (the bound was removed).
version: "0.1"

project:
  name: email-agent

agent:
  name: "Standup Jack Agent"
  declared_purpose:
    - Answer customer FAQ questions
    - Update billing information through the Stripe Customer Portal
    - Send customers their missing invoices
  prohibited_actions:
    - Issue a refund without human approval
    - Cancel a subscription without explicit confirmation
    - Update or close a payment dispute without review

environment:
  target: production_like

tool_sources:
  - id: openai_sdk_support_agent
    type: openai_agents_sdk
    path: support_agent.py

policies:
  require_approval_for_tools: []
  require_confirmation_for_tools: []
  require_idempotency_for_tools: []

permissions:
  scopes: []

ci:
  mode: advisory

output:
  directory: agents-shipgate-reports
  formats:
    - json
