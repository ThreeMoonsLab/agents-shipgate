actions:
  - op: write
    path: shipgate.yaml
    content: |
      version: "0.1"
      project:
        name: openai-agents-sdk
      agent:
        name: refund-assistant
        declared_purpose:
          - answer refund policy questions
        prohibited_actions: []
      environment:
        target: local
      tool_sources:
        - id: openapi_main
          type: openapi
          path: specs/support-tools.openapi.yaml
      policies:
        require_approval_for_tools: []
        require_confirmation_for_tools: []
        require_idempotency_for_tools: []
      permissions:
        scopes:
          - support:tickets:read
      ci:
        mode: advisory
      output:
        directory: agents-shipgate-reports
        formats:
          - markdown
          - json
  - op: append
    path: .gitignore
    content: |

      # Agents Shipgate
      agents-shipgate-reports/
